<!DOCTYPE html><html lang="pt"><meta charset="utf-8"><title>Gerar chaves VAPID</title>
<body style="font:16px system-ui;max-width:640px;margin:40px auto;padding:0 16px">
<h1>Chaves VAPID (Web Push)</h1>
<p>Abre este ficheiro no teu computador (não o publiques no site). Clica em gerar e copia os valores para as variáveis do Netlify.</p>
<button onclick="g()" style="padding:10px 16px;font-size:16px">Gerar chaves</button>
<pre id=o style="white-space:pre-wrap;word-break:break-all;background:#eee;padding:12px;margin-top:16px"></pre>
<script>
const b=u=>btoa(String.fromCharCode(...new Uint8Array(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const d=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function g(){const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']);const j=await crypto.subtle.exportKey('jwk',k.privateKey);
const x=d(j.x),y=d(j.y),pub=new Uint8Array(65);pub[0]=4;pub.set(x,1);pub.set(y,33);
o.textContent='VAPID_PUBLIC_KEY='+b(pub)+'\n\nVAPID_PRIVATE_KEY='+j.d+'\n\nVAPID_SUBJECT=mailto:o-teu-email@exemplo.com\n\nGuarda a chave privada em segredo (só no Netlify).'}
</script></body></html>
