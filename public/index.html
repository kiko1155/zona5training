<style>
:root{box-sizing:border-box;--ink:#0e0f0c;--slab:#1a1b17;--plate:#23251f;--edge:#33362d;--chalk:#ecebe4;--dust:#9a9b8f;--volt:#d4ff3a;--ember:#ff6b35;--tide:#5cc8ff;--bloom:#c792ff;--fd:"Big Shoulders Display",Impact,sans-serif;--fs:"Instrument Sans",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace}

a{color:inherit;text-decoration:none}h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}

.w100{width:100%}.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:20px}.mb2{margin-bottom:8px}.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}

.err{color:var(--ember);font-size:13px;margin-bottom:12px}
.chip{font:inherit;font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--edge);background:none;color:var(--dust);cursor:pointer}.chip:hover{color:var(--chalk)}.chip.on{background:var(--volt);color:var(--ink);border-color:var(--volt);font-weight:600}
.rp{font-family:var(--fm);font-size:12px;padding:8px;border-radius:6px;border:1px solid var(--edge);background:none;color:var(--dust);cursor:pointer}.rp.on{background:var(--volt);color:var(--ink);border-color:var(--volt);font-weight:600}
.ch{font-family:var(--fm);font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid}
.ch-e2{background:rgba(255,107,53,.2);color:var(--ember);border-color:rgba(255,107,53,.4)}.ch-e1{background:rgba(255,107,53,.1);color:rgba(255,107,53,.9);border-color:rgba(255,107,53,.25)}.ch-v{background:rgba(212,255,58,.1);color:var(--volt);border-color:rgba(212,255,58,.3)}.ch-t{background:rgba(92,200,255,.1);color:var(--tide);border-color:rgba(92,200,255,.3)}
.box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-radius:12px;background:rgba(35,37,31,.7);border:1px solid var(--edge);padding:16px}
.sub{border:1px solid var(--edge);background:rgba(35,37,31,.6);border-radius:12px;padding:16px}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(51,54,45,.5);font-size:14px}.li:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-weight:400;color:var(--dust);text-align:left;padding:6px 0}td{padding:6px 0;border-top:1px solid rgba(51,54,45,.5)}.tr{text-align:right}
.hl{background:var(--volt);color:var(--ink);border-radius:4px;font-weight:600;padding:0 4px}
.hb{display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;border:1px solid var(--edge);text-align:left;background:none;color:inherit;font:inherit;cursor:pointer;width:100%;transition:.15s}.hb:hover{border-color:var(--dust)}.hb.done{border-color:rgba(212,255,58,.5);background:rgba(212,255,58,.06)}.hb:active{transform:scale(.98)}
.hi{width:40px;height:40px;border-radius:8px;background:var(--plate);display:grid;place-items:center}.hi svg{width:20px;height:20px}
.ck{width:24px;height:24px;border-radius:6px;border:2px solid var(--edge);display:grid;place-items:center;font-size:12px;font-weight:700}.done .ck{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.done .nm{text-decoration:line-through;color:var(--dust)}
.gr{border-spacing:0}.gr td{padding:3px;border:0}.gr td.nmc{padding-right:16px;white-space:nowrap;color:var(--dust)}.gr th{text-align:center;padding-bottom:8px;width:24px}
.sq{display:block;width:20px;height:20px;border-radius:5px;border:1px solid var(--edge);background:rgba(35,37,31,.4);cursor:pointer;padding:0}.sq:hover{transform:scale(1.1)}.sq.t{outline:1px solid rgba(236,235,228,.4);outline-offset:1px}
.f-volt{background:var(--volt);border-color:var(--volt)}.f-tide{background:var(--tide);border-color:var(--tide)}.f-ember{background:var(--ember);border-color:var(--ember)}.f-bloom{background:var(--bloom);border-color:var(--bloom)}
.tk{width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-size:12px;font-weight:700;cursor:pointer;background:none;color:var(--ink);padding:0;flex-shrink:0}.tk.on{background:var(--volt);border-color:var(--volt)}.tk:hover{border-color:var(--volt)}
.dd{display:flex;gap:4px}.dd span{width:20px;height:20px;border-radius:4px;background:var(--plate);color:var(--dust);font-size:9px;display:grid;place-items:center}.dd span.y{background:rgba(212,255,58,.8);color:var(--ink)}
.pill{font-size:12px;padding:6px 10px;border-radius:99px;border:1px solid var(--edge);background:none;color:var(--chalk);cursor:pointer}.pill:hover{border-color:var(--volt);color:var(--volt)}
.ph{display:flex;gap:6px;margin-top:8px}.ph img{width:31%;border-radius:8px}
.photo{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--edge);border-radius:8px;cursor:pointer;font-size:14px;color:var(--chalk)}.photo:hover{border-color:var(--dust);background:var(--plate)}
details summary{cursor:pointer;color:var(--dust);font-size:13px}
.auth{max-width:420px;margin:12vh auto 0;padding:0 16px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){.rise{animation:none}}
/* v2 */
.qk{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;padding:8px 4px;cursor:pointer;text-align:left;border-radius:8px}.qk:hover{background:var(--plate)}.qk:active{transform:scale(.99)}
.qk.done .ck{background:var(--volt);border-color:var(--volt);color:var(--ink)}.qk.done .nm{text-decoration:line-through;color:var(--dust)}
.bnav,.scrim,.sheet,.mtop{display:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-140%);background:var(--slab);border:1px solid var(--volt);color:var(--chalk);padding:10px 16px;border-radius:12px;z-index:100;transition:transform .3s;max-width:90vw;font-size:14px}#toast.show{transform:translate(-50%,0)}
@media(max-width:1023px){.side{display:none}.mtop{display:flex;align-items:center;gap:10px;margin-bottom:20px}main{padding-bottom:104px}
.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(14,15,12,.94);backdrop-filter:blur(12px);border-top:1px solid var(--edge);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:10px;color:var(--dust);background:none;border:0;padding:6px 0;cursor:pointer;border-radius:10px}.bnav .on{color:var(--volt)}.bnav svg{width:22px;height:22px}
.scrim{display:block;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55)}

.sheet .nv{width:100%}}
</style></head><body><div id="app"><p style="color:#9a9b8f;padding:16px">A carregar…</p></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MEALS=['Pequeno-almoço','Lanche da manhã','Almoço','Lanche da tarde','Jantar','Ceia'];
const wd=s=>new Date(s+'T12:00').getDay();
const wk=s=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const r1=v=>Math.round(v*10)/10;
let me,cur,D,view='login',tab='treino',date=iso(),draft=null,pw={},clients=[],info={},err='';
const defD=()=>({plans:{},sessions:[],weights:[],habits:[],hlog:{},meals:{},supps:[],slog:{}});
const app=()=>document.getElementById('app');
const sb=supabase.createClient(CFG.url,CFG.key);
const EM=u=>u+'@zone5.example.com';
const uid=s=>String(s).trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'');
const save=async()=>{const{error}=await sb.from('user_data').upsert({user_id:cur,data:D,updated_at:new Date().toISOString()});if(error)err='Erro ao guardar: '+error.message;else cacheD()};
const mut=async f=>{if(OFF){err='Sem ligação: modo só de leitura.';return render()}f();await save();render()};
async function fn(name,body){const{data:{session}}=await sb.auth.getSession();const r=await fetch('/.netlify/functions/'+name,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erro '+r.status));return j}
async function login(){const u=uid($('#lu').value),p=$('#lp').value;const{error}=await sb.auth.signInWithPassword({email:EM(u),password:p});if(error){err='Credenciais inválidas';return render()}err='';await boot()}
async function boot(){try{if(!navigator.onLine&&await offBoot())return;const{data:{session}}=await sb.auth.getSession();if(!session){view='login';return render()}const{data:a,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error&&/fetch|network|load failed/i.test(error.message||'')&&await offBoot())return;if(error||!a){err='Conta sem perfil. Contacta o administrador.';await sb.auth.signOut();view='login';return render()}me=a;cacheMe();await enter()}catch(e){if((!navigator.onLine||/fetch|network|load failed/i.test(e.message||''))&&await offBoot())return;err='Erro: '+e.message;view='login';render()}}
async function reg(){if($('#rh').value)return;const u=uid($('#ru').value),p=$('#rp').value;if(u.length<3){err='Username com pelo menos 3 caracteres';return render()}if(p.length<8||p!==$('#rq').value){err='As passwords têm de coincidir e ter pelo menos 8 caracteres';return render()}
 try{const r=await fetch('/.netlify/functions/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,name:$('#rn').value})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erro '+r.status));const{error}=await sb.auth.signInWithPassword({email:EM(u),password:p});if(error)throw error;err='';await boot()}catch(e){err=e.message;render()}}
async function enter(){if(me.role==='admin'){view='admin';await loadAdmin()}else await openC(me.id);render()}
async function openC(u){cur=u;let row;if(OFF)row={data:readD(u)};else{const r=await sb.from('user_data').select('data').eq('user_id',u).maybeSingle();row=r.data}D=Object.assign(defD(),row?.data||{});view='app';tab=curTab();date=iso();draft=null;pw={};startDraft();if(!OFF)cacheD()}
async function loadAdmin(){const{data}=await sb.from('profiles').select('*').eq('role','client').order('name');clients=data||[];const{data:ud}=await sb.from('user_data').select('user_id,data');info={};clients.forEach(c=>{const d=(ud||[]).find(x=>x.user_id===c.id)?.data||{};const w=(d.weights||[]).slice(-1)[0];info[c.id]={n:(d.sessions||[]).length,w:w?w.kg:'-',l:(d.sessions||[]).slice(-1)[0]?.d||'-'}})}
async function logout(){clearCache();OFF=false;await sb.auth.signOut();me=cur=D=null;view='login';render()}
async function addClient(){const u=uid($('#nu').value),p=$('#np').value;if(!u||p.length<6){err='Username e password (mín. 6 caracteres)';return render()}try{await fn('admin',{action:'create',username:u,password:p,name:$('#nn').value||u});err='';await loadAdmin()}catch(e){err=e.message}render()}
async function saveAssoc(u){const a=clients.find(c=>c.id===u);a.pt=$('#pt_'+u).value;a.gym=$('#gy_'+u).value;const{error}=await sb.from('profiles').update({pt:a.pt,gym:a.gym}).eq('id',u);alert(error?error.message:'Guardado')}
async function delClient(u){if(!confirm('Remover este cliente e todos os seus dados?'))return;try{await fn('admin',{action:'delete',id:u});await loadAdmin();err=''}catch(e){err=e.message}render()}
async function resetPw(u){const p=prompt('Nova password (mín. 6 caracteres):');if(!p||p.length<6)return;try{await fn('admin',{action:'password',id:u,password:p});alert('Password alterada')}catch(e){alert(e.message)}}

function startDraft(){const p=D.plans[wd(date)];draft={d:date,plan:p?.name||'',ex:(p?.exs||[]).map(n=>({n,s:[['','']]})),dur:'',rpe:7}}
function setDate(v){date=v||iso();startDraft();render()}
function savePlan(){const ex=$('#pe').value.split('\n').map(s=>s.trim()).filter(Boolean);mut(()=>{D.plans[wd(date)]={name:$('#pn').value,exs:ex};startDraft()})}
function addSet(i){draft.ex[i].s.push(['','']);render()}
function addEx(){const n=$('#xn').value.trim();if(n){draft.ex.push({n,s:[['','']]});render()}}
function saveSess(){const ex=draft.ex.map(e=>({n:e.n,s:e.s.filter(s=>num(s[1])>0).map(s=>[num(s[0]),num(s[1]),s[2]?num(s[2]):draft.rpe])})).filter(e=>e.s.length);if(!ex.length&&!num(draft.dur)){err='Regista pelo menos uma série ou a duração';return render()}err='';
 const vol=ex.reduce((a,e)=>a+e.s.reduce((b,s)=>b+s[0]*s[1],0),0);mut(()=>{D.sessions.push({d:date,plan:draft.plan,dur:num(draft.dur),rpe:draft.rpe,ex,vol,load:num(draft.dur)*draft.rpe});startDraft()})}
const delSess=i=>mut(()=>D.sessions.splice(i,1));

const $=s=>document.querySelector(s);

 :`<div class=auth><div class="card rise">${brand}<h2 class="h2 mb4">Entrar</h2><div style="display:grid;gap:12px"><input id=lu class=input placeholder=Username autocapitalize=none><input id=lp type=password class=input placeholder=Password onkeydown="event.key=='Enter'&&login()"></div>${E?`<p class="err mt3">${esc(err)}</p>`:''}<div class="row mt4"><button class=btn-volt onclick="login()">Entrar</button><button class=btn-ghost onclick="view='register';err='';render()">Criar conta</button></div></div></div>`}

/* ===== v2 · navegação inferior, interação rápida, treino, macros dinâmicos, lembretes, PWA/offline ===== */
let OFF=false,moreOpen=false;
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};

/* ---------- Offline (cache local só de leitura) ---------- */
function cacheD(){if(me&&cur&&D&&cur===me.id)LS('z5d:'+cur,JSON.stringify(D))}
const readD=u=>{try{return JSON.parse(LS('z5d:'+u)||'null')}catch(e){return null}};
const cacheMe=()=>LS('z5me',JSON.stringify(me));
const cachedMe=()=>{try{return JSON.parse(LS('z5me')||'null')}catch(e){return null}};
function clearCache(){try{Object.keys(localStorage).filter(k=>/^z5(d:|me|fired)/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function offBoot(){const m=cachedMe();if(!m||m.role==='admin'||!readD(m.id))return false;OFF=true;me=m;await openC(m.id);render();return true}
window.addEventListener('offline',()=>{if(view==='app'){OFF=true;render()}});
window.addEventListener('online',()=>{if(OFF)location.reload()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

/* ---------- Notificações e lembretes ---------- */
const notifOK=()=>'Notification' in window&&Notification.permission==='granted';
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className=''},6000)}
async function ping(title,body,tag){try{if(!notifOK())return toast(title+' — '+body);const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const o={body,tag,icon:'/icon-192.png',badge:'/icon-192.png',vibrate:[100,50,100]};if(reg&&reg.showNotification)return reg.showNotification(title,o);new Notification(title,o)}catch(e){toast(title+' — '+body)}}
async function askNotif(){if(!('Notification' in window)){err='Este browser não suporta notificações.';return render()}const p=await Notification.requestPermission();if(p==='granted'){err='';ping('Zone5Training','Notificações ativas.','z5-on')}else err='Notificações bloqueadas no browser. Ativa-as nas definições do site.';render()}
const notifCard=()=>{const ok=notifOK(),sup='Notification' in window;return`<div class="card p5 rise"><div class=label>${ic('bell')} Lembretes</div>${!sup?'<p class="sm-t mt2">Este browser não suporta notificações.</p>':ok?`<p class="mt2" style="font-size:14px">Notificações ativas neste dispositivo.</p><button class="btn-ghost mt3" onclick="ping('Zone5Training','Notificação de teste','z5-test')">Testar</button>`:`<p class="sm-t mt2">Ativa as notificações para receberes lembretes à hora definida.</p><button class="btn-volt mt3" onclick="askNotif()">${ic('bell')} Ativar notificações</button>`}<p class="xs-t mt3">Os lembretes disparam com a app aberta ou em segundo plano (se o sistema o permitir). Com a app totalmente fechada não são garantidos.</p></div>`};
const mins=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
function due(t,hm){const out=[];D.supps.forEach(s=>{const m=mins(s.tm);if(m!=null&&hm>=m&&hm-m<=5&&!(D.slog[t]||[]).includes(s.n))out.push({k:`s|${t}|${s.n}|${s.tm}`,title:'Suplemento: '+s.n,body:`${s.d||'Hora da toma'} · ${s.tm}`})});
 D.habits.forEach(h=>{const r=(D.hrem||{})[h];if(!r||!r.ev||(D.hlog[t]||[]).includes(h))return;const a=mins(r.from||'09:00'),b=mins(r.to||'21:00');if(a==null||b==null)return;for(let m=a;m<=b;m+=r.ev*60)if(hm>=m&&hm-m<=5)out.push({k:`h|${t}|${h}|${m}`,title:'Hábito pendente',body:h})});return out}
function tick(){try{if(!me||!D||view!=='app'||cur!==me.id)return;const n=new Date(),t=iso(n),hm=n.getHours()*60+n.getMinutes();let f={};try{f=JSON.parse(LS('z5fired')||'{}')}catch(e){}let ch=false;Object.keys(f).forEach(k=>{if(k.split('|')[1]!==t){delete f[k];ch=true}});due(t,hm).forEach(x=>{if(f[x.k])return;f[x.k]=1;ch=true;ping(x.title,x.body,x.k)});if(ch)LS('z5fired',JSON.stringify(f))}catch(e){}}
setInterval(tick,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- Água ---------- */
const wTot=d=>(D.water||{})[d]||0,wGoal=()=>D.waterGoal||2500;
const addWater=ml=>mut(()=>{D.water=D.water||{};const t=iso();D.water[t]=Math.max(0,wTot(t)+ml)});
const saveWG=()=>{const v=num($('#wg').value);if(v>0)mut(()=>{D.waterGoal=v})};
const waterBox=()=>{const t=iso(),w=wTot(t),g=wGoal();return`<div class=sub style="margin-top:16px"><div class="row between"><span class=label>${ic('droplets')} Água hoje</span><span class="num sm-t"><span style="color:var(--chalk)">${w}</span> / ${g} ml</span></div><div class=mt2>${bar(w,g,'bg-t')}</div><div class="row mt3"><button class=btn-ghost onclick="addWater(250)">+250 ml</button><button class=btn-ghost onclick="addWater(500)">+500 ml</button><button class=btn-x aria-label="Desfazer 250 ml" onclick="addWater(-250)">−250</button></div></div>`};

/* ---------- Metas dinâmicas: dia de treino vs descanso ---------- */
const TGT={kcal:2800,p:165,c:340,f:80},TGR={kcal:2300,p:165,c:240,f:75};
const isTrain=d=>{const o=(D.dtype||{})[d];if(o)return o==='train';const p=D.plans[wd(d)];return D.sessions.some(s=>s.d===d)||!!(p&&p.exs&&p.exs.length)};
const TG=d=>{const g=D.tg||{};return isTrain(d)?Object.assign({},TGT,D.targets||{},g.train||{}):Object.assign({},TGR,g.rest||{})};
const setDT=v=>mut(()=>{D.dtype=D.dtype||{};if(v)D.dtype[date]=v;else delete D.dtype[date]});
const saveTg=()=>{const r=(s,d)=>({kcal:num($('#tk'+s).value)||d.kcal,p:num($('#tp'+s).value)||d.p,c:num($('#tc'+s).value)||d.c,f:num($('#tf'+s).value)||d.f});mut(()=>{D.tg={train:r(1,TGT),rest:r(2,TGR)}})};
const dtChip=d=>`<span class="ch ${isTrain(d)?'ch-v':'ch-t'}">${isTrain(d)?'Dia de treino':'Dia de descanso'}</span>`;

/* ---------- Treino: 1RM/RIR em tempo real e histórico de cargas ---------- */
function prevOf(name,d){const L=D.sessions.filter(s=>s.d<d&&s.ex.some(e=>e.n===name)).sort((a,b)=>a.d<b.d?1:-1)[0];return L?{d:L.d,s:L.ex.find(e=>e.n===name).s}:null}
const exHead=(e,i)=>{const p=prevOf(e.n,draft.d||date);return`<div class=mb4><p style="font-weight:600">${esc(e.n)}</p>${p?`<p class="sm-t num">Última vez (${fmtDate(p.d)}): ${p.s.map(x=>String(x[0]).replace('.',',')+'×'+x[1]).join(' · ')}</p>`:'<p class=sm-t>Sem registo anterior deste exercício.</p>'}`};
function rowInfo(i,j){const s=draft.ex[i].s[j],k=num(s[0]),r=num(s[1]),p=num(s[2])||draft.rpe;return k>0&&r>0?`1RM ≈ <b class=volt>${fm(e1(k,r,p))} kg</b> · RIR ${fm(rir(p))}`:''}
const ri=(i,j)=>{const e=$('#ri_'+i+'_'+j);if(e)e.innerHTML=rowInfo(i,j)};
function setRow(e,i,j){const s=e.s[j],p=prevOf(e.n,draft.d||date),r=p?(p.s[j]||p.s[p.s.length-1]):null;
 return`<div class=mt2><div class=row style="gap:6px"><span class="sm-t num">S${j+1}</span><input class="input num sm" style="width:84px" inputmode=decimal placeholder="kg" value="${esc(s[0])}" oninput="draft.ex[${i}].s[${j}][0]=this.value;ri(${i},${j});upd()"><input class="input num sm" style="width:74px" inputmode=numeric placeholder="reps" value="${esc(s[1])}" oninput="draft.ex[${i}].s[${j}][1]=this.value;ri(${i},${j});upd()"><select class="input num sm" style="width:84px" onchange="draft.ex[${i}].s[${j}][2]=this.value;ri(${i},${j});upd()"><option value="">RPE</option>${RPES.map(v=>`<option value=${v} ${s[2]==v?'selected':''}>${String(v).replace('.',',')}</option>`).join('')}</select>${r?`<span class="sm-t num" title="Treino anterior">ref. ${String(r[0]).replace('.',',')}×${r[1]}</span>`:''}</div><p class="sm-t num" id="ri_${i}_${j}" style="margin:2px 0 0 28px">${rowInfo(i,j)}</p></div>`}
function pvHtml(){let v=0,best=0,n=0;draft.ex.forEach(e=>e.s.forEach(s=>{const k=num(s[0]),r=num(s[1]);if(r>0){n++;v+=k*r;if(k>0)best=Math.max(best,e1(k,r,num(s[2])||draft.rpe))}}));return`<div><p class=label>Volume</p><p class="num big">${n?Math.round(v)+' kg':'—'}</p></div><div><p class=label>Reps em reserva</p><p class="num big">${fm(rir(draft.rpe))}</p></div><div><p class=label>1RM estimado</p><p class="num big volt">${best?fm(best)+' kg':'—'}</p></div>`}
function calcOut(){const k=num(cal.kg),r=num(cal.reps)||1,p=num(cal.rpe),o=e1(k,r,p),rr=[1,2,3,4,5,6,8,10,12],cs=[10,9,8,7,6];
 return`<div class=box style="grid-template-columns:repeat(2,1fr)"><div><p class=label>1RM estimado</p><p class="num big volt">${k>0?fm(o)+' kg':'—'}</p></div><div><p class=label>RIR (reps em reserva)</p><p class="num big">${fm(rir(p))}</p></div></div><div class=mt4 style="overflow-x:auto"><table class=num><tr><th>Reps \\ RPE</th>${cs.map(c=>`<th class=tr>@${c}</th>`).join('')}</tr>${rr.map(x=>`<tr><td class=dust>${x}</td>${cs.map(c=>`<td class="tr ${x==num(cal.reps)&&c==Math.round(p)?'hl':''}">${o>0?tgt(o,x,c):'—'}</td>`).join('')}</tr>`).join('')}</table></div>`}
const calcUpd=()=>{const e=$('#calout');if(e)e.innerHTML=calcOut()};
function calc(){return`<div class="card rise" style="animation-delay:260ms"><div class=label>${ic('calculator')} Calculadora 1RM & RIR</div><h2 class="h2 mb4">Carga · Reps · RPE</h2><div class="g g3 nm" style="grid-template-columns:repeat(3,1fr)"><label><span class=sm-t>Carga (kg)</span><input class="input num mt1" inputmode=decimal value="${esc(cal.kg)}" oninput="cal.kg=this.value;calcUpd()"></label><label><span class=sm-t>Reps</span><input class="input num mt1" inputmode=numeric value="${esc(cal.reps)}" oninput="cal.reps=this.value;calcUpd()"></label><label><span class=sm-t>RPE</span><select class="input num mt1" onchange="cal.rpe=this.value;calcUpd()">${RPES.map(v=>`<option value=${v} ${cal.rpe==v?'selected':''}>${String(v).replace('.',',')}</option>`).join('')}</select></label></div><div id=calout class=mt4>${calcOut()}</div><p class="xs-t mt3">RPE 10 = falha, 9 = 1 rep em reserva, 8 = 2 reps… Estimativa de Epley com reps em reserva, arredondada a 2,5 kg.</p></div>`}

/* ---------- Painel ---------- */
function tPainel(){const t=iso(),A=WK(),ks=Object.keys(A).sort(),ck=wk(t),cw=A[ck]||{v:0,n:0,sets:0,r:0,l:0},pv=(A[prevWk(ck)]||{}).v;
 const wks=ks.slice(-8),T=tot(todayMeals(t)),G=TG(t),hd=D.habits.filter(h=>(D.hlog[t]||[]).includes(h)).length,sd=D.supps.filter(s=>(D.slog[t]||[]).includes(s.n)).length,ls=lowStock();
 const dl=pv?(cw.v-pv)/pv*100:null,ar=cw.n?cw.r/cw.n:0,wsess=D.sessions.filter(s=>wk(s.d)===ck);
 let h=hdr('Olá, '+esc((me.role==='admin'?(clients.find(c=>c.id===cur)||{}).name:me.name)||''),'Painel do dia',`<a href="#/treino" class="btn-volt">Registar sessão ${ic('arrow-up-right')}</a>`);
 h+=`<section class="g g4">${stat('Volume semanal',fmtKg(cw.v),'',dl==null?'Sem semana anterior':`<span class="${dl>=0?'volt':'ember'}">${dl>=0?'+':''}${dl.toFixed(0)}% vs. semana anterior</span>`)}${stat('Séries efetivas',cw.sets,'',cw.n+' sessões esta semana',0,60)}${stat('RPE médio',cw.n?fm(ar):'—','',cw.n?`≈ ${fm(10-ar)} reps em reserva`:'','ember',120)}${stat('Carga interna (sRPE)',Math.round(cw.l),'UA','RPE sessão × minutos',0,180)}</section>`;
 h+=`<section class="g ca"><div class="card rise" style="animation-delay:220ms"><div class="row between mb4"><div><p class=label>Tonelagem por semana</p><h2 class=h2>Volume de carga</h2></div><a href="#/evolucao" class=sm-t>Ver evolução →</a></div>${wks.length?cv(240,{type:'bar',data:{labels:wks.map(k=>k.slice(5)),datasets:[{label:'Volume (kg)',data:wks.map(k=>A[k].v),backgroundColor:wks.map(k=>k===ck?CO.volt:'rgba(236,235,228,.18)'),borderRadius:6}]},options:BO({plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtKg(Number(c.raw))}}}})}):'<p class=sm-t>Sem sessões registadas.</p>'}</div>
 <div class="card rise" style="animation-delay:280ms"><p class=label>Esta semana</p><h2 class="h2 mb4">Sessões</h2>${wsess.map(s=>`<div class=li><span>${fmtDate(s.d)} · ${esc(s.plan||'—')}</span><span class="num sm-t">${Math.round(s.vol)} kg · @${String(s.rpe).replace('.',',')}</span></div>`).join('')||'<p class=sm-t>Ainda sem sessões esta semana.</p>'}</div></section>`;
 h+=`<section class="g g3 nm"><a href="#/nutricao" class="card hov rise" style="animation-delay:340ms"><div class="row between"><div class=label>${ic('flame')} Nutrição de hoje</div>${dtChip(t)}</div><p class="fd mt3" style="font-size:36px;font-weight:800">${Math.round(T.k)}<span class=dust style="font-size:18px"> / ${G.kcal} kcal</span></p><div class=mt4>${[['Proteína',T.p,G.p,'bg-v'],['Hidratos',T.c,G.c,'bg-t'],['Gordura',T.f,G.f,'bg-e']].map(([l,v,m,c])=>`<div class=mb2><div class="row between sm-t"><span>${l}</span><span class=num>${Math.round(v)} / ${m} g</span></div>${bar(v,m,c)}</div>`).join('')}</div></a>
 <div class="card rise" style="animation-delay:400ms"><div class="row between"><div class=label>${ic('layers')} Hábitos</div><a href="#/habitos" class=sm-t>Ver →</a></div><p class="fd mt3" style="font-size:36px;font-weight:800">${hd}<span class=dust style="font-size:18px"> / ${D.habits.length} hoje</span></p><ul class=mt3>${D.habits.map((x,i)=>{const d=(D.hlog[t]||[]).includes(x);return`<li><button class="qk ${d?'done':''}" onclick="togH('${t}',${i})"><span class=ck style="width:22px;height:22px;font-size:11px">${d?'✓':''}</span><span class=nm>${esc(x)}</span></button></li>`}).join('')||'<p class=sm-t>Sem hábitos. Cria o primeiro em Hábitos.</p>'}</ul>${waterBox()}</div>
 <div class="card rise" style="animation-delay:460ms"><div class="row between"><div class=label>${ic('gauge')} Suplementação</div><a href="#/suplementos" class=sm-t>Ver →</a></div><p class="fd mt3" style="font-size:36px;font-weight:800">${sd}<span class=dust style="font-size:18px"> / ${D.supps.length} tomas</span></p><ul class=mt3>${D.supps.map((s,i)=>{const k=(D.slog[t]||[]).includes(s.n);return`<li><button class="qk ${k?'done':''}" onclick="togSd('${t}',${i})"><span class=ck style="width:22px;height:22px;font-size:11px;border-radius:50%">${k?'✓':''}</span><span class=nm style="flex:1">${esc(s.n)}</span><span class=sm-t>${esc(s.tm||s.sl||'Manhã')}</span></button></li>`}).join('')||'<p class=sm-t>Sem suplementos.</p>'}</ul>${ls.length?`<p class="sm-t ember mt3">${ic('package-open')} Stock baixo: ${ls.map(s=>esc(s.n)).join(', ')}</p>`:''}</div></section>`;
 return h}

/* ---------- Hábitos (com água e lembretes) ---------- */
const addH=()=>{const v=$('#hn').value.trim();if(!v||D.habits.includes(v))return;const ev=num($('#hv').value),f=$('#hf').value||'09:00',to=$('#ht').value||'21:00';if(ev&&'Notification' in window&&Notification.permission==='default')askNotif();mut(()=>{D.habits.push(v);if(ev){D.hrem=D.hrem||{};D.hrem[v]={ev,from:f,to}}})};
const delH=i=>mut(()=>{const h=D.habits[i];D.habits.splice(i,1);if(D.hrem)delete D.hrem[h]});
const editHR=i=>{const h=D.habits[i],c=(D.hrem||{})[h],v=prompt('Lembrar de quantas em quantas horas? (0 = sem lembrete)',c?c.ev:0);if(v===null)return;const ev=num(v);if(ev&&'Notification' in window&&Notification.permission==='default')askNotif();mut(()=>{D.hrem=D.hrem||{};if(ev>0)D.hrem[h]={ev,from:c?c.from:'09:00',to:c?c.to:'21:00'};else delete D.hrem[h]})};
function tHab(){const t=iso(),days=lastDays(28),H=D.habits,done=H.filter(x=>(D.hlog[t]||[]).includes(x)).length,R=D.hrem||{};
 const tot28=H.length*28,ok=days.reduce((a,d)=>a+H.filter(x=>(D.hlog[d]||[]).includes(x)).length,0),best=H.reduce((a,x)=>Math.max(a,streak(x)),0),perf=H.length?days.filter(d=>H.every(x=>(D.hlog[d]||[]).includes(x))).length:0;
 let h=hdr('Últimos 28 dias','Hábitos');
 h+=`<section class="g g4">${stat('Feitos hoje',done+'/'+H.length,'','','volt')}${stat('Taxa de cumprimento',tot28?(ok/tot28*100).toFixed(0):'0','%','',0,60)}${stat('Melhor sequência atual',best,'dias','',0,120)}${stat('Dias perfeitos',perf,'','Todos os hábitos cumpridos',0,180)}</section>`;
 h+=`<section class="g ce"><div class="card rise" style="animation-delay:200ms"><p class=label>Checklist</p><h2 class="h2 mb4">Hoje</h2><ul class="g g2 nm" style="gap:12px">${H.map((x,i)=>{const d=(D.hlog[t]||[]).includes(x);return`<li><button class="hb ${d?'done':''}" onclick="togH('${t}',${i})"><span class="hi ${hcol(i)}">${ic('target')}</span><span style="flex:1"><span class=nm style="display:block;font-weight:600">${esc(x)}</span><span class=sm-t>${ic('flame')} ${streak(x)} dias${R[x]?` · ${ic('bell')} ${R[x].ev}h`:''}</span></span><span class=ck>${d?'✓':''}</span></button></li>`}).join('')||'<p class=sm-t>Ainda sem hábitos. Cria o primeiro.</p>'}</ul>${waterBox()}
 <details class=mt4><summary>Meta de água</summary><div class="row mt2"><input id=wg class="input num sm" style="width:110px" inputmode=numeric value="${wGoal()}"><span class=sm-t>ml por dia</span><button class=btn-ghost onclick="saveWG()">Guardar</button></div></details></div>
 <div style="display:grid;gap:16px;align-self:start"><div class="card rise" style="animation-delay:260ms"><p class=label>Novo hábito</p><h2 class="h2 mb4">Adicionar</h2><input id=hn class=input placeholder="Ex.: Alongamentos"><label class=mt3 style="display:block"><span class=sm-t>Lembrete periódico</span><select id=hv class="input mt1"><option value="">Sem lembrete</option><option value=1>A cada 1 hora</option><option value=2>A cada 2 horas</option><option value=3>A cada 3 horas</option><option value=4>A cada 4 horas</option></select></label><div class="row mt3"><label><span class=sm-t>Das</span><input id=hf type=time value="09:00" class="input sm mt1"></label><label><span class=sm-t>Às</span><input id=ht type=time value="21:00" class="input sm mt1"></label></div><button class="btn-volt w100 mt3" onclick="addH()">${ic('plus')} Criar hábito</button><p class="sm-t mt3">Só és lembrado se o hábito ainda estiver por fazer nesse dia.</p></div>${notifCard()}</div></section>`;
 h+=`<section class="card rise" style="overflow-x:auto;animation-delay:320ms"><p class=label>Histórico</p><h2 class="h2 mb4">Grelha de consistência</h2><table class=gr><tr><th></th>${days.map((d,i)=>`<th class="${i==27?'volt':'dust'}">${d.slice(8)}</th>`).join('')}<th></th></tr>${H.map((x,i)=>`<tr><td class=nmc>${esc(x)}</td>${days.map((d,j)=>`<td><button class="sq ${(D.hlog[d]||[]).includes(x)?'f-'+hcol(i):''} ${j==27?'t':''}" aria-label="${esc(x)} ${d}" onclick="togH('${d}',${i})"></button></td>`).join('')}<td style="white-space:nowrap"><button class=btn-x aria-label="Lembrete" title="Lembrete" onclick="editHR(${i})">${ic('bell')}</button><button class=btn-x aria-label="Remover hábito" onclick="delH(${i})">${ic('trash-2')}</button></td></tr>`).join('')}</table></section>`;
 return h}

/* ---------- Refeições (metas dinâmicas) ---------- */
function tRef(){const d=dm(),all=todayMeals(date),T=tot(all),G=TG(date),left=G.kcal-T.k,auto=!(D.dtype||{})[date],tr=isTrain(date),Gt=Object.assign({},TGT,D.targets||{},(D.tg||{}).train||{}),Gr=Object.assign({},TGR,(D.tg||{}).rest||{});
 let h=hdr('Registo diário','Refeições',`<input class="input sm" type=date value="${date}" onchange="date=this.value||iso();addM=null;render()">`);
 h+=`<section class="g cd"><div class="card rise" style="align-self:start"><div class="row" style="gap:4px"><button class="chip ${tr?'on':''}" onclick="setDT('train')">Dia de treino</button><button class="chip ${!tr?'on':''}" onclick="setDT('rest')">Dia de descanso</button>${auto?'':`<button class=chip onclick="setDT('')">Auto</button>`}</div><p class="xs-t mt2">${auto?'Automático: '+(tr?'há treino ou plano definido para este dia.':'sem treino nem plano para este dia.'):'Escolha manual para este dia.'}</p>
 <p class="label mt4">Balanço do dia</p><div style="position:relative" class=mt2>${cv(200,{type:'doughnut',data:{labels:['Proteína','Hidratos','Gordura'],datasets:[{data:[T.p*4,T.c*4,T.f*9],backgroundColor:[CO.volt,CO.tide,CO.ember],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'78%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${Math.round(Number(c.raw))} kcal`}}}}})}<div style="position:absolute;inset:0;display:grid;place-items:center;pointer-events:none"><div style="text-align:center"><p class=fd style="font-size:36px;font-weight:800">${Math.round(T.k)}</p><p class=sm-t>de ${G.kcal} kcal</p></div></div></div>
 <p class="mt4 sm-t ${left>=0?'':'ember'}" style="text-align:center;font-size:14px">${left>=0?`Faltam ${Math.round(left)} kcal`:`${Math.round(-left)} kcal acima da meta`}</p>
 <div class=mt5>${[['Proteína',T.p,G.p,'bg-v'],['Hidratos',T.c,G.c,'bg-t'],['Gordura',T.f,G.f,'bg-e']].map(([l,v,m,c])=>`<div class=mb4><div class="row between sm-t"><span style="color:var(--chalk)">${l}</span><span class=num>${Math.round(v)} / ${m} g</span></div>${bar(v,m,c)}</div>`).join('')}</div>
 <details class=mt3><summary>Metas diárias (treino / descanso)</summary>${[[1,'Dia de treino',Gt],[2,'Dia de descanso',Gr]].map(([s,n,g])=>`<p class="sm-t mt3">${n}</p><div class="row mt1"><input id=tk${s} class="input num sm" style="width:72px" placeholder=kcal value="${g.kcal}"><input id=tp${s} class="input num sm" style="width:60px" placeholder=P value="${g.p}"><input id=tc${s} class="input num sm" style="width:60px" placeholder=H value="${g.c}"><input id=tf${s} class="input num sm" style="width:60px" placeholder=G value="${g.f}"></div>`).join('')}<button class="btn-ghost mt3" onclick="saveTg()">Guardar metas</button></details></div>
 <div style="display:grid;gap:16px">`;
 MEALS.forEach((n,m)=>{const a=d[m]||[],t=tot(a);h+=`<article class="card p5 rise" style="animation-delay:${m*60}ms"><header class="row between mb2" style="align-items:baseline"><h3 class=h2>${n}</h3><p class="num sm-t"><span style="color:var(--chalk)">${Math.round(t.k)} kcal</span> · P ${r1(t.p)} · H ${r1(t.c)} · G ${r1(t.f)}</p></header>`+a.map((x,i)=>`<div class=li><span>${esc(x.n)} <span class=sm-t>· ${r1(x.g)} g</span></span><span class=row style="gap:12px"><span class="num sm-t">${Math.round(x.kcal)} kcal · ${r1(x.p)}P</span><button class=btn-x aria-label="Remover alimento" onclick="delFood(${m},${i})">${ic('trash-2')}</button></span></div>`).join('');
  h+=addM===m?`<div class="sub mt3"><div class="row between mb2"><p class=label>Adicionar alimento</p><button class=btn-x aria-label=Fechar onclick="addM=null;render()">${ic('x')}</button></div><div class=row><input id=fn${m} class="input grow" placeholder="Alimento"><input id=fg${m} class="input num sm" style="width:84px" inputmode=decimal placeholder="gramas"></div><p class="sm-t mt2">Valores por 100 g:</p><div class=row><input id=fk${m} class="input num sm" style="width:76px" placeholder=kcal><input id=fp${m} class="input num sm" style="width:68px" placeholder="P (g)"><input id=fc${m} class="input num sm" style="width:68px" placeholder="H (g)"><input id=ff${m} class="input num sm" style="width:68px" placeholder="G (g)"><button class=btn-volt onclick="addFood(${m})">${ic('plus')} Adicionar</button></div><div class=mt3><label class=photo><span id=pb${m}>${ic('camera')} Foto do prato ou produtos</span><input type=file accept="image/*" hidden onchange="photoFood(${m},this)"></label></div></div>`:`<button class="btn-x mt2 sm-t" style="font-size:12px" onclick="addM=${m};render()">+ Adicionar alimento</button>`;
  h+=`</article>`});
 return h+`</div></section>`}

/* ---------- Suplementação (com horários) ---------- */
const addS=()=>{const n=$('#sn').value.trim();if(!n)return;const st=$('#ss').value.trim(),tm=$('#stm').value;if(tm&&'Notification' in window&&Notification.permission==='default')askNotif();mut(()=>D.supps.push({n,d:$('#sd').value,sl:$('#sl').value,tm,st:st===''?null:num(st)}))};
const togSd=(d,i)=>mut(()=>{const a=D.slog[d]||(D.slog[d]=[]),s=D.supps[i],k=a.indexOf(s.n);k<0?a.push(s.n):a.splice(k,1);if(s.st!=null)s.st=Math.max(0,s.st+(k<0?-1:1))});
const togS=i=>togSd(date,i);
const setSTm=(i,v)=>{if(v&&'Notification' in window&&Notification.permission==='default')askNotif();mut(()=>{D.supps[i].tm=v})};
function tSup(){const days=lastDays(7,date),WD=['D','S','T','Q','Q','S','S'],S=D.supps,done=S.filter(s=>(D.slog[date]||[]).includes(s.n)).length,ls=lowStock();
 const ad=S.length?S.reduce((a,s)=>a+days.slice(0,6).filter(d=>(D.slog[d]||[]).includes(s.n)).length,0)/(S.length*6)*100:0;
 let h=hdr('Rotina diária','Suplementação',`<input class="input sm" type=date value="${date}" onchange="date=this.value||iso();render()">`);
 h+=`<section class="g g4">${stat('Tomas no dia',done+'/'+S.length,'','','volt')}${stat('Adesão (6 dias)',ad.toFixed(0),'%','',0,60)}${stat('Suplementos ativos',S.length,'','',0,120)}${stat('Stock baixo',ls.length,'',ls.length?ls.map(s=>esc(s.n)).join(', '):'Tudo abastecido',ls.length?'ember':'',180)}</section>`;
 h+=`<section class="g ce nm"><div style="display:grid;gap:16px;align-self:start">`;
 SLOTS.forEach((sl,si)=>{const L=S.map((s,i)=>[s,i]).filter(([s])=>(s.sl||'Manhã')===sl);if(!L.length)return;h+=`<div class="card p5 rise" style="animation-delay:${200+si*60}ms"><div class="row mb2" style="gap:12px"><span class="hi volt" style="width:36px;height:36px">${ic(SLI[sl][0])}</span><div><h2 class=h2 style="line-height:1">${sl}</h2><p class=sm-t>${SLI[sl][1]}</p></div></div>`+L.map(([s,i])=>{const tk=(D.slog[date]||[]).includes(s.n);return`<div class=li style="flex-wrap:wrap;gap:12px;padding:12px 0"><button class="tk ${tk?'on':''}" aria-pressed="${tk}" aria-label="Marcar ${esc(s.n)}" onclick="togS(${i})">${tk?'✓':''}</button><div style="flex:1;min-width:130px"><p style="font-weight:600;${tk?'color:var(--dust);text-decoration:line-through':''}">${esc(s.n)} <span class="num volt" style="font-size:12px;font-weight:400;margin-left:4px">${esc(s.d)}</span></p></div><label class=row style="gap:6px" title="Hora do lembrete">${ic('bell')}<input type=time class="input num sm" style="width:112px;padding:6px 8px" value="${s.tm||''}" onchange="setSTm(${i},this.value)" aria-label="Hora da toma"></label><div class=dd title="Últimos 7 dias">${days.map((d,k)=>`<span class="${(D.slog[d]||[]).includes(s.n)?'y':''}" style="${k==6?'outline:1px solid rgba(236,235,228,.4)':''}">${WD[new Date(d+'T12:00').getDay()]}</span>`).join('')}</div>${s.st!=null?`<div style="width:96px"><p class="num ${s.st<14?'ember':'dust'}" style="font-size:11px;margin-bottom:4px">${s.st} doses</p>${bar(s.st,90,s.st<14?'bg-e':'bg-c')}</div>`:''}<button class=btn-x aria-label="Remover" onclick="delS(${i})">${ic('trash-2')}</button></div>`}).join('')+`</div>`});
 if(!S.length)h+=`<div class="card sm-t" style="text-align:center;padding:40px">Ainda sem suplementos. Adiciona o primeiro.</div>`;
 h+=`</div><div style="display:grid;gap:16px;align-self:start"><div class="card rise" style="animation-delay:260ms"><p class=label>Novo suplemento</p><h2 class="h2 mb4">Adicionar</h2><div style="display:grid;gap:12px"><input id=sn class=input placeholder="Nome (ex.: Zinco)"><input id=sd class=input placeholder="Dose (ex.: 15 mg)"><select id=sl class=input>${SLOTS.map(x=>`<option>${x}</option>`).join('')}</select><label><span class=sm-t>Hora do lembrete (opcional)</span><input id=stm type=time class="input mt1"></label><input id=ss class="input num" inputmode=numeric placeholder="Stock em doses (opcional)"><button class="btn-volt w100" onclick="addS()">${ic('plus')} Adicionar à rotina</button></div></div>${notifCard()}${ls.length?`<div class="card p5 rise" style="border-color:rgba(255,107,53,.4)"><p class="ember" style="font-weight:600;font-size:14px">${ic('package-open')} Reabastecer em breve</p><div class="sm-t mt2">${ls.map(s=>`<p>${esc(s.n)} — ~${s.st} doses restantes</p>`).join('')}</div></div>`:''}<p class=xs-t>Informação de organização pessoal, não substitui aconselhamento médico ou de um nutricionista.</p></div></section>`;
 return h}

/* ---------- Estrutura: sidebar (desktop) + barra inferior (mobile) ---------- */
const NB=[['painel','Painel','layout-dashboard'],['treino','Treino','dumbbell'],['evolucao','Evolução','chart-line'],['nutricao','Nutrição','utensils-crossed']];
const MORE=['habitos','suplementos','peso'];
function bnav(){if(view==='admin')return`<nav class=bnav><button class=on>${ic('users')}<span>Clientes</span></button><button onclick="logout()">${ic('log-out')}<span>Sair</span></button></nav>`;
 return`<nav class=bnav aria-label="Navegação principal">${NB.map(([k,l,i])=>`<a class="${tab===k&&!moreOpen?'on':''}" href="#/${k}">${ic(i)}<span>${l}</span></a>`).join('')}<button class="${moreOpen||MORE.includes(tab)?'on':''}" aria-expanded="${moreOpen}" onclick="moreOpen=!moreOpen;render()">${ic('ellipsis')}<span>Mais</span></button></nav>`}
function sheet(){if(!moreOpen||view!=='app')return'';const adm=me.role==='admin';
 return`<div class=scrim onclick="moreOpen=false;render()"></div><div class=sheet>${NAVC.filter(n=>MORE.includes(n[0])).map(([k,l,i])=>`<a class="nv ${tab===k?'on':''}" href="#/${k}" onclick="moreOpen=false;render()">${ic(i)}<span>${l}</span></a>`).join('')}${adm?`<button class=nv onclick="moreOpen=false;loadAdmin().then(()=>{view='admin';render()})">${ic('users')}<span>Clientes</span></button>`:''}${!notifOK()&&'Notification' in window?`<button class=nv onclick="moreOpen=false;askNotif()">${ic('bell')}<span>Ativar notificações</span></button>`:''}<button class=nv onclick="logout()">${ic('log-out')}<span>Sair</span></button></div>`}
function render(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];post=[];let h='';const E=err?'1':'';
 if(view==='login'||view==='register')h=authView(E);
 else{const adm=me.role==='admin',inC=view==='app',c=adm?clients.find(x=>x.id===cur):me,eb=(OFF?`<p class=err>Sem ligação — modo só de leitura (plano de treino e plano alimentar).</p>`:'')+(err?`<p class=err>${esc(err)}</p>`:'');
  const nav=(inC?NAVC:[]).map(([k,l,i])=>`<a class="nv ${tab===k?'on':''}" href="#/${k}">${ic(i)}<span class=lb>${l}</span></a>`).join('');
  const side=`<aside class=side><div class=brand><div class=logo>${ic('activity')}</div><div class=bt><p class=bn>ZONE5</p><p class=bs>Training</p></div></div><nav class=nav>${adm?`<button class="nv ${inC?'':'on'}" onclick="loadAdmin().then(()=>{view='admin';render()})">${ic('users')}<span class=lb>Clientes</span></button>`:''}${nav}<button class=nv onclick="logout()">${ic('log-out')}<span class=lb>Sair</span></button></nav><div class="who card" style="padding:16px"><p class=label>${adm&&inC?'Cliente':adm?'Administrador':'Atleta'}</p><p style="font-weight:600;margin-top:4px">${esc((view==='admin'?me:c||me).name||'')}</p>${inC&&c&&(c.pt||c.gym)?`<p class=sm-t>${esc([c.pt&&'PT: '+c.pt,c.gym&&c.gym].filter(Boolean).join(' · '))}</p>`:''}<p class="sm-t mt3" style="text-transform:capitalize">${new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})}</p></div></aside>`;
  const body=view==='admin'?tAdmin():({painel:tPainel,treino:tTreino,evolucao:tEvolucao,habitos:tHab,nutricao:tRef,suplementos:tSup,peso:tPeso})[tab]();
  h=`<div class=app>${side}<main><div class=mtop><div class=logo style="width:30px;height:30px">${ic('activity')}</div><p class=bn style="font-size:20px">ZONE5</p></div>${eb}${body}</main>${bnav()}${sheet()}</div>`}
 const y=scrollY;app().innerHTML=h;scrollTo(0,y);post.forEach(f=>f());try{if(window.lucide){lucide.createIcons();document.documentElement.classList.add('ic')}}catch(e){}}

boot();
</script></body></html>
