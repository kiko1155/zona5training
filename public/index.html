<style>
:root{box-sizing:border-box;--ink:#0e0f0c;--slab:#1a1b17;--plate:#23251f;--edge:#33362d;--chalk:#ecebe4;--dust:#9a9b8f;--volt:#d4ff3a;--ember:#ff6b35;--tide:#5cc8ff;--bloom:#c792ff;--fd:"Big Shoulders Display",Impact,sans-serif;--fs:"Instrument Sans",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace}

.chip{font:inherit;font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--edge);background:none;color:var(--dust);cursor:pointer}.chip:hover{color:var(--chalk)}.chip.on{background:var(--volt);color:var(--ink);border-color:var(--volt);font-weight:600}
.rp{font-family:var(--fm);font-size:12px;padding:8px;border-radius:6px;border:1px solid var(--edge);background:none;color:var(--dust);cursor:pointer}.rp.on{background:var(--volt);color:var(--ink);border-color:var(--volt);font-weight:600}
.ch{font-family:var(--fm);font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid}
.ch-e2{background:rgba(255,107,53,.2);color:var(--ember);border-color:rgba(255,107,53,.4)}.ch-e1{background:rgba(255,107,53,.1);color:rgba(255,107,53,.9);border-color:rgba(255,107,53,.25)}.ch-v{background:rgba(212,255,58,.1);color:var(--volt);border-color:rgba(212,255,58,.3)}.ch-t{background:rgba(92,200,255,.1);color:var(--tide);border-color:rgba(92,200,255,.3)}
.box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-radius:12px;background:rgba(35,37,31,.7);border:1px solid var(--edge);padding:16px}

table{width:100%;border-collapse:collapse;font-size:13px}th{font-weight:400;color:var(--dust);text-align:left;padding:6px 0}td{padding:6px 0;border-top:1px solid rgba(51,54,45,.5)}.tr{text-align:right}
.hl{background:var(--volt);color:var(--ink);border-radius:4px;font-weight:600;padding:0 4px}
.hb{display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;border:1px solid var(--edge);text-align:left;background:none;color:inherit;font:inherit;cursor:pointer;width:100%;transition:.15s}.hb:hover{border-color:var(--dust)}.hb.done{border-color:rgba(212,255,58,.5);background:rgba(212,255,58,.06)}.hb:active{transform:scale(.98)}
.hi{width:40px;height:40px;border-radius:8px;background:var(--plate);display:grid;place-items:center}.hi svg{width:20px;height:20px}

.done .nm{text-decoration:line-through;color:var(--dust)}
.gr{border-spacing:0}.gr td{padding:3px;border:0}.gr td.nmc{padding-right:16px;white-space:nowrap;color:var(--dust)}.gr th{text-align:center;padding-bottom:8px;width:24px}

.f-volt{background:var(--volt);border-color:var(--volt)}.f-tide{background:var(--tide);border-color:var(--tide)}.f-ember{background:var(--ember);border-color:var(--ember)}.f-bloom{background:var(--bloom);border-color:var(--bloom)}
.tk{width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-size:12px;font-weight:700;cursor:pointer;background:none;color:var(--ink);padding:0;flex-shrink:0}.tk.on{background:var(--volt);border-color:var(--volt)}.tk:hover{border-color:var(--volt)}
.dd{display:flex;gap:4px}.dd span{width:20px;height:20px;border-radius:4px;background:var(--plate);color:var(--dust);font-size:9px;display:grid;place-items:center}.dd span.y{background:rgba(212,255,58,.8);color:var(--ink)}
.pill{font-size:12px;padding:6px 10px;border-radius:99px;border:1px solid var(--edge);background:none;color:var(--chalk);cursor:pointer}.pill:hover{border-color:var(--volt);color:var(--volt)}
.ph{display:flex;gap:6px;margin-top:8px}.ph img{width:31%;border-radius:8px}

details summary{cursor:pointer;color:var(--dust);font-size:13px}
.auth{max-width:420px;margin:12vh auto 0;padding:0 16px}

.qk.done .ck{background:var(--volt);border-color:var(--volt);color:var(--ink)}.qk.done .nm{text-decoration:line-through;color:var(--dust)}
.bnav,.scrim,.sheet,.mtop{display:none}

@media(max-width:1023px){.side{display:none}.mtop{display:flex;align-items:center;gap:10px;margin-bottom:20px}main{padding-bottom:104px}

.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:10px;color:var(--dust);background:none;border:0;padding:6px 0;cursor:pointer;border-radius:10px}.bnav .on{color:var(--volt)}.bnav svg{width:22px;height:22px}

.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--edge);border-top-color:var(--volt);border-radius:50%;animation:sp .8s linear infinite;flex-shrink:0}

</style></head><body><div id="app"><p style="color:#9a9b8f;padding:16px">A carregar…</p></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MEALS=['Pequeno-almoço','Lanche da manhã','Almoço','Lanche da tarde','Jantar','Ceia'];
const wd=s=>new Date(s+'T12:00').getDay();
const wk=s=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const r1=v=>Math.round(v*10)/10;
let me,cur,D,view='login',tab='treino',date=iso(),draft=null,pw={},clients=[],info={},err='';
const defD=()=>({plans:{},sessions:[],weights:[],habits:[],hlog:{},meals:{},supps:[],slog:{}});
const app=()=>document.getElementById('app');
const sb=supabase.createClient(CFG.url,CFG.key);
const EM=u=>u+'@zone5.example.com';
const uid=s=>String(s).trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'');


async function fn(name,body){const{data:{session}}=await sb.auth.getSession();const r=await fetch('/.netlify/functions/'+name,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erro '+r.status));return j}
async function login(){const u=uid($('#lu').value),p=$('#lp').value;const{error}=await sb.auth.signInWithPassword({email:EM(u),password:p});if(error){err='Credenciais inválidas';return render()}err='';await boot()}
async function boot(){try{if(!navigator.onLine&&await offBoot())return;const{data:{session}}=await sb.auth.getSession();if(!session){view='login';return render()}const{data:a,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error&&/fetch|network|load failed/i.test(error.message||'')&&await offBoot())return;if(error||!a){err='Conta sem perfil. Contacta o administrador.';await sb.auth.signOut();view='login';return render()}me=a;cacheMe();await enter()}catch(e){if((!navigator.onLine||/fetch|network|load failed/i.test(e.message||''))&&await offBoot())return;err='Erro: '+e.message;view='login';render()}}
async function reg(){if($('#rh').value)return;const u=uid($('#ru').value),p=$('#rp').value;if(u.length<3){err='Username com pelo menos 3 caracteres';return render()}if(p.length<8||p!==$('#rq').value){err='As passwords têm de coincidir e ter pelo menos 8 caracteres';return render()}
 try{const r=await fetch('/.netlify/functions/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,name:$('#rn').value})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erro '+r.status));const{error}=await sb.auth.signInWithPassword({email:EM(u),password:p});if(error)throw error;err='';await boot()}catch(e){err=e.message;render()}}
async function enter(){if(me.role==='admin'){view='admin';await loadAdmin()}else await openC(me.id);render()}
async function openC(u){cur=u;let row;if(OFF)row={data:readD(u)};else{const r=await sb.from('user_data').select('data').eq('user_id',u).maybeSingle();row=r.data}D=Object.assign(defD(),row?.data||{});view='app';tab=curTab();date=iso();draft=null;pw={};startDraft();planDraft=null;snapBase();if(!OFF)cacheD()}
async function loadAdmin(){const{data}=await sb.from('profiles').select('*').eq('role','client').order('name');clients=data||[];const{data:ud}=await sb.from('user_data').select('user_id,data');tpls=(((ud||[]).find(x=>x.user_id===me.id)||{}).data||{}).templates||[];info={};clients.forEach(c=>{const d=(ud||[]).find(x=>x.user_id===c.id)?.data||{};const w=(d.weights||[]).slice(-1)[0];info[c.id]={n:(d.sessions||[]).length,w:w?w.kg:'-',l:(d.sessions||[]).slice(-1)[0]?.d||'-'}})}
async function logout(){clearCache();OFF=false;await unsubPush();await sb.auth.signOut();me=cur=D=null;view='login';render()}





function startDraft(){const p=planFor(date);draft={d:date,plan:p?.name||'',ex:(p?.exs||[]).map(n=>({n:parseEx(n).n,s:[['','']]})),dur:'',rpe:7}}
function setDate(v){date=v||iso();startDraft();render()}
function savePlan(){const ex=$('#pe').value.split('\n').map(s=>s.trim()).filter(Boolean);mut(()=>{D.plans[wd(date)]={name:$('#pn').value,exs:ex};startDraft()}).then(ok=>ok&&toast('Plano do dia guardado ✓'))}
function addSet(i){draft.ex[i].s.push(['','']);render()}

async function ping(title,body,tag){try{if(!notifOK())return toast(title+' — '+body);const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const o={body,tag,icon:'/icon-192.png',badge:'/icon-192.png',vibrate:[100,50,100]};if(reg&&reg.showNotification)return reg.showNotification(title,o);new Notification(title,o)}catch(e){toast(title+' — '+body)}}


const mins=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};


setInterval(tick,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

/* ---------- Água ---------- */
const wTot=d=>(D.water||{})[d]||0,wGoal=()=>D.waterGoal||2500;
const addWater=ml=>mut(()=>{D.water=D.water||{};const t=iso();D.water[t]=Math.max(0,wTot(t)+ml)});
const saveWG=()=>{const v=num($('#wg').value);if(v>0)mut(()=>{D.waterGoal=v})};


/* ---------- Metas dinâmicas: dia de treino vs descanso ---------- */
const TGT={kcal:2800,p:165,c:340,f:80},TGR={kcal:2300,p:165,c:240,f:75};
const isTrain=d=>{const o=(D.dtype||{})[d];if(o)return o==='train';const p=D.plans[wd(d)];return D.sessions.some(s=>s.d===d)||!!(p&&p.exs&&p.exs.length)};
const TG=d=>{const g=D.tg||{};return isTrain(d)?Object.assign({},TGT,D.targets||{},g.train||{}):Object.assign({},TGR,g.rest||{})};
const setDT=v=>mut(()=>{D.dtype=D.dtype||{};if(v)D.dtype[date]=v;else delete D.dtype[date]});

const dtChip=d=>`<span class="ch ${isTrain(d)?'ch-v':'ch-t'}">${isTrain(d)?'Dia de treino':'Dia de descanso'}</span>`;

/* ---------- Treino: 1RM/RIR em tempo real e histórico de cargas ---------- */
function prevOf(name,d){const L=D.sessions.filter(s=>s.d<d&&s.ex.some(e=>e.n===name)).sort((a,b)=>a.d<b.d?1:-1)[0];return L?{d:L.d,s:L.ex.find(e=>e.n===name).s}:null}

function rowInfo(i,j){const s=draft.ex[i].s[j],k=num(s[0]),r=num(s[1]),p=num(s[2])||draft.rpe;return k>0&&r>0?`1RM ≈ <b class=volt>${fm(e1(k,r,p))} kg</b> · RIR ${fm(rir(p))}`:''}
const ri=(i,j)=>{const e=$('#ri_'+i+'_'+j);if(e)e.innerHTML=rowInfo(i,j)};
function setRow(e,i,j){const s=e.s[j],p=prevOf(e.n,draft.d||date),r=p?(p.s[j]||p.s[p.s.length-1]):null;
 return`<div class=mt2><div class=row style="gap:6px"><span class="sm-t num">S${j+1}</span><input class="input num sm" style="width:84px" inputmode=decimal placeholder="kg" value="${esc(s[0])}" oninput="draft.ex[${i}].s[${j}][0]=this.value;ri(${i},${j});upd()"><input class="input num sm" style="width:74px" inputmode=numeric placeholder="reps" value="${esc(s[1])}" oninput="draft.ex[${i}].s[${j}][1]=this.value;ri(${i},${j});upd()"><select class="input num sm" style="width:84px" onchange="draft.ex[${i}].s[${j}][2]=this.value;ri(${i},${j});upd()"><option value="">RPE</option>${RPES.map(v=>`<option value=${v} ${s[2]==v?'selected':''}>${String(v).replace('.',',')}</option>`).join('')}</select>${r?`<span class="sm-t num" title="Treino anterior">ref. ${String(r[0]).replace('.',',')}×${r[1]}</span>`:''}</div><p class="sm-t num" id="ri_${i}_${j}" style="margin:2px 0 0 28px">${rowInfo(i,j)}</p></div>`}
function pvHtml(){let v=0,best=0,n=0;draft.ex.forEach(e=>e.s.forEach(s=>{const k=num(s[0]),r=num(s[1]);if(r>0){n++;v+=k*r;if(k>0)best=Math.max(best,e1(k,r,num(s[2])||draft.rpe))}}));return`<div><p class=label>Volume</p><p class="num big">${n?Math.round(v)+' kg':'—'}</p></div><div><p class=label>Reps em reserva</p><p class="num big">${fm(rir(draft.rpe))}</p></div><div><p class=label>1RM estimado</p><p class="num big volt">${best?fm(best)+' kg':'—'}</p></div>`}
function calcOut(){const k=num(cal.kg),r=num(cal.reps)||1,p=num(cal.rpe),o=e1(k,r,p),rr=[1,2,3,4,5,6,8,10,12],cs=[10,9,8,7,6];
 return`<div class=box style="grid-template-columns:repeat(2,1fr)"><div><p class=label>1RM estimado</p><p class="num big volt">${k>0?fm(o)+' kg':'—'}</p></div><div><p class=label>RIR (reps em reserva)</p><p class="num big">${fm(rir(p))}</p></div></div><div class=mt4 style="overflow-x:auto"><table class=num><tr><th>Reps \\ RPE</th>${cs.map(c=>`<th class=tr>@${c}</th>`).join('')}</tr>${rr.map(x=>`<tr><td class=dust>${x}</td>${cs.map(c=>`<td class="tr ${x==num(cal.reps)&&c==Math.round(p)?'hl':''}">${o>0?tgt(o,x,c):'—'}</td>`).join('')}</tr>`).join('')}</table></div>`}
const calcUpd=()=>{const e=$('#calout');if(e)e.innerHTML=calcOut()};
function calc(){return`<div class="card rise" style="animation-delay:260ms"><div class=label>${ic('calculator')} Calculadora 1RM & RIR</div><h2 class="h2 mb4">Carga · Reps · RPE</h2><div class="g g3 nm" style="grid-template-columns:repeat(3,1fr)"><label><span class=sm-t>Carga (kg)</span><input class="input num mt1" inputmode=decimal value="${esc(cal.kg)}" oninput="cal.kg=this.value;calcUpd()"></label><label><span class=sm-t>Reps</span><input class="input num mt1" inputmode=numeric value="${esc(cal.reps)}" oninput="cal.reps=this.value;calcUpd()"></label><label><span class=sm-t>RPE</span><select class="input num mt1" onchange="cal.rpe=this.value;calcUpd()">${RPES.map(v=>`<option value=${v} ${cal.rpe==v?'selected':''}>${String(v).replace('.',',')}</option>`).join('')}</select></label></div><div id=calout class=mt4>${calcOut()}</div><p class="xs-t mt3">RPE 10 = falha, 9 = 1 rep em reserva, 8 = 2 reps… Estimativa de Epley com reps em reserva, arredondada a 2,5 kg.</p></div>`}

/* ---------- Painel ---------- */

 const wks=ks.slice(-8),T=tot(todayMeals(t)),G=TG(t),hd=D.habits.filter(h=>(D.hlog[t]||[]).includes(h)).length,sd=D.supps.filter(s=>(D.slog[t]||[]).includes(s.n)).length,ls=lowStock();
 const dl=pv?(cw.v-pv)/pv*100:null,ar=cw.n?cw.r/cw.n:0,wsess=D.sessions.filter(s=>wk(s.d)===ck);
 let h=hdr('Olá, '+esc((me.role==='admin'?(clients.find(c=>c.id===cur)||{}).name:me.name)||''),'Painel do dia',`<a href="#/treino" class="btn-volt">Registar sessão ${ic('arrow-up-right')}</a>`);
 h+=`<section class="g g4">${stat('Volume semanal',fmtKg(cw.v),'',dl==null?'Sem semana anterior':`<span class="${dl>=0?'volt':'ember'}">${dl>=0?'+':''}${dl.toFixed(0)}% vs. semana anterior</span>`)}${stat('Séries efetivas',cw.sets,'',cw.n+' sessões esta semana',0,60)}${stat('RPE médio',cw.n?fm(ar):'—','',cw.n?`≈ ${fm(10-ar)} reps em reserva`:'','ember',120)}${stat('Carga interna (sRPE)',Math.round(cw.l),'UA','RPE sessão × minutos',0,180)}</section>`;
 h+=readySection();h+=`<section class="g ca"><div class="card rise" style="animation-delay:220ms"><div class="row between mb4"><div><p class=label>Tonelagem por semana</p><h2 class=h2>Volume de carga</h2></div><a href="#/evolucao" class=sm-t>Ver evolução →</a></div>${wks.length?cv(240,{type:'bar',data:{labels:wks.map(k=>k.slice(5)),datasets:[{label:'Volume (kg)',data:wks.map(k=>A[k].v),backgroundColor:wks.map(k=>k===ck?CO.volt:'rgba(236,235,228,.18)'),borderRadius:6}]},options:BO({plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtKg(Number(c.raw))}}}})}):'<p class=sm-t>Sem sessões registadas.</p>'}</div>
 <div class="card rise" style="animation-delay:280ms"><p class=label>Esta semana</p><h2 class="h2 mb4">Sessões</h2>${wsess.map(s=>`<div class=li><span>${fmtDate(s.d)} · ${esc(s.plan||'—')}</span><span class="num sm-t">${Math.round(s.vol)} kg · @${String(s.rpe).replace('.',',')}</span></div>`).join('')||'<p class=sm-t>Ainda sem sessões esta semana.</p>'}</div></section>`;
 h+=`<section class="g g3 nm"><a href="#/nutricao" class="card hov rise" style="animation-delay:340ms"><div class="row between"><div class=label>${ic('flame')} Nutrição de hoje</div>${dtChip(t)}</div><p class="fd mt3" style="font-size:36px;font-weight:800">${Math.round(T.k)}<span class=dust style="font-size:18px"> / ${G.kcal} kcal</span></p><div class=mt4>${[['Proteína',T.p,G.p,'bg-v'],['Hidratos',T.c,G.c,'bg-t'],['Gordura',T.f,G.f,'bg-e']].map(([l,v,m,c])=>`<div class=mb2><div class="row between sm-t"><span>${l}</span><span class=num>${Math.round(v)} / ${m} g</span></div>${bar(v,m,c)}</div>`).join('')}</div></a>
 <div class="card rise" style="animation-delay:400ms"><div class="row between"><div class=label>${ic('layers')} Hábitos</div><a href="#/habitos" class=sm-t>Ver →</a></div><p class="fd mt3" style="font-size:36px;font-weight:800">${hd}<span class=dust style="font-size:18px"> / ${D.habits.length} hoje</span></p><ul class=mt3>${D.habits.map((x,i)=>{const d=(D.hlog[t]||[]).includes(x);return`<li><button class="qk ${d?'done':''}" onclick="togH('${t}',${i})"><span class=ck style="width:22px;height:22px;font-size:11px">${d?'✓':''}</span><span class=nm>${esc(x)}</span></button></li>`}).join('')||'<p class=sm-t>Sem hábitos. Cria o primeiro em Hábitos.</p>'}</ul>${waterBox()}</div>
 <div class="card rise" style="animation-delay:460ms"><div class="row between"><div class=label>${ic('gauge')} Suplementação</div><a href="#/suplementos" class=sm-t>Ver →</a></div><p class="fd mt3" style="font-size:36px;font-weight:800">${sd}<span class=dust style="font-size:18px"> / ${D.supps.length} tomas</span></p><ul class=mt3>${D.supps.map((s,i)=>{const k=(D.slog[t]||[]).includes(s.n);return`<li><button class="qk ${k?'done':''}" onclick="togSd('${t}',${i})"><span class=ck style="width:22px;height:22px;font-size:11px;border-radius:50%">${k?'✓':''}</span><span class=nm style="flex:1">${esc(s.n)}</span><span class=sm-t>${esc(s.tm||s.sl||'Manhã')}</span></button></li>`}).join('')||'<p class=sm-t>Sem suplementos.</p>'}</ul>${ls.length?`<p class="sm-t ember mt3">${ic('package-open')} Stock baixo: ${ls.map(s=>esc(s.n)).join(', ')}</p>`:''}</div></section>`;
 return h}

/* ---------- Hábitos (com água e lembretes) ---------- */
const addH=()=>{const v=$('#hn').value.trim();if(!v||D.habits.includes(v))return;const ev=num($('#hv').value),f=$('#hf').value||'07:00',to=$('#ht').value||'21:00';if(ev&&'Notification' in window&&Notification.permission==='default')askNotif();mut(()=>{D.habits.push(v);if(ev){D.hrem=D.hrem||{};D.hrem[v]={ev,from:f,to}}})};
const delH=i=>mut(()=>{const h=D.habits[i];D.habits.splice(i,1);if(D.hrem)delete D.hrem[h]});

function tHab(){const t=iso(),days=lastDays(28),H=D.habits,done=H.filter(x=>(D.hlog[t]||[]).includes(x)).length,R=D.hrem||{};
 const tot28=H.length*28,ok=days.reduce((a,d)=>a+H.filter(x=>(D.hlog[d]||[]).includes(x)).length,0),best=H.reduce((a,x)=>Math.max(a,streak(x)),0),perf=H.length?days.filter(d=>H.every(x=>(D.hlog[d]||[]).includes(x))).length:0;
 let h=hdr('Últimos 28 dias','Hábitos');
 h+=`<section class="g g4">${stat('Feitos hoje',done+'/'+H.length,'','','volt')}${stat('Taxa de cumprimento',tot28?(ok/tot28*100).toFixed(0):'0','%','',0,60)}${stat('Melhor sequência atual',best,'dias','',0,120)}${stat('Dias perfeitos',perf,'','Todos os hábitos cumpridos',0,180)}</section>`;
 h+=`<section class="g ce"><div class="card rise" style="animation-delay:200ms"><p class=label>Checklist</p><h2 class="h2 mb4">Hoje</h2><ul class="g g2 nm" style="gap:12px">${H.map((x,i)=>{const d=(D.hlog[t]||[]).includes(x);return`<li class=hli><button class="hb ${d?'done':''}" onclick="togH('${t}',${i})"><span class="hi ${hcol(i)}">${ic('target')}</span><span style="flex:1"><span class=nm style="display:block;font-weight:600">${esc(x)}</span><span class=sm-t>${ic('flame')} ${streak(x)} dias${R[x]?` · ${ic('bell')} ${R[x].ev}h`:''}</span></span><span class=ck>${d?'✓':''}</span></button><span class=hact><button class=btn-x aria-label="Lembrete" title="Lembrete" onclick="editHR(${i})">${ic('bell')}</button><button class=btn-x aria-label="Remover hábito" onclick="delH(${i})">${ic('trash-2')}</button></span></li>`}).join('')||'<p class=sm-t>Ainda sem hábitos. Cria o primeiro.</p>'}</ul>${waterBox()}
 <details class=mt4><summary>Meta de água</summary><div class="row mt2"><input id=wg class="input num sm" style="width:110px" inputmode=numeric value="${wGoal()}"><span class=sm-t>ml por dia</span><button class=btn-ghost onclick="saveWG()">Guardar</button></div></details><details class=mt3><summary>Lembretes de água</summary><div class="sub mt2"><label class=row style="gap:8px"><input id=wro type=checkbox ${WR().on?'checked':''}> Ativos</label><div class="row mt2"><label><span class=sm-t>A cada</span><select id=wrv class="input sm mt1">${[1,2,3].map(v=>`<option value=${v} ${WR().ev==v?'selected':''}>${v} h</option>`).join('')}</select></label><label><span class=sm-t>Das</span><input id=wrf type=time class="input sm mt1" value="${WR().from}"></label><label><span class=sm-t>Às</span><input id=wrt type=time class="input sm mt1" value="${WR().to}"></label></div><button class="btn-ghost mt3" onclick="saveWR()">Guardar</button><p class="xs-t mt2">Param quando a meta do dia está concluída e retomam às ${WR().from} do dia seguinte.</p></div></details></div>
 <div style="display:grid;gap:16px;align-self:start"><div class="card rise" style="animation-delay:260ms"><p class=label>Novo hábito</p><h2 class="h2 mb4">Adicionar</h2><input id=hn class=input placeholder="Ex.: Alongamentos"><label class=mt3 style="display:block"><span class=sm-t>Lembrete periódico</span><select id=hv class="input mt1"><option value=0>Sem lembrete</option><option value=1 selected>A cada 1 hora</option><option value=2>A cada 2 horas</option><option value=3>A cada 3 horas</option><option value=4>A cada 4 horas</option></select></label><div class="row mt3"><label><span class=sm-t>Das</span><input id=hf type=time value="07:00" class="input sm mt1"></label><label><span class=sm-t>Às</span><input id=ht type=time value="21:00" class="input sm mt1"></label></div><button class="btn-volt w100 mt3" onclick="addH()">${ic('plus')} Criar hábito</button><p class="sm-t mt3">Só és lembrado se o hábito ainda estiver por fazer nesse dia.</p></div>${notifCard()}</div></section>`;
 
 return h}

/* ---------- Refeições (metas dinâmicas) ---------- */

 let h=hdr('Registo diário','Refeições',`<input class="input sm" type=date value="${date}" onchange="date=this.value||iso();addM=null;render()">`);
 h+=`<section class="g cd"><div class="card rise" style="align-self:start"><div class="row" style="gap:4px"><button class="chip ${tr?'on':''}" onclick="setDT('train')">Dia de treino</button><button class="chip ${!tr?'on':''}" onclick="setDT('rest')">Dia de descanso</button>${auto?'':`<button class=chip onclick="setDT('')">Auto</button>`}</div><p class="xs-t mt2">${auto?'Automático: '+(tr?'há treino ou plano definido para este dia.':'sem treino nem plano para este dia.'):'Escolha manual para este dia.'}</p>

 <p class="mt4 sm-t ${left>=0?'':'ember'}" style="text-align:center;font-size:14px;cursor:pointer" title="Editar metas" onclick="openTargets()">${left>=0?`Faltam ${Math.round(left)} kcal`:`${Math.round(-left)} kcal acima da meta`}</p>
 <div class=mt5 style="cursor:pointer" title="Editar metas" onclick="openTargets()">${[['Proteína',T.p,G.p,'bg-v'],['Hidratos',T.c,G.c,'bg-t'],['Gordura',T.f,G.f,'bg-e']].map(([l,v,m,c])=>`<div class=mb4><div class="row between sm-t"><span style="color:var(--chalk)">${l}</span><span class=num>${Math.round(v)} / ${m} g</span></div>${bar(v,m,c)}</div>`).join('')}</div>
 <button class="btn-ghost mt3 w100" onclick="openTargets()">${ic('pencil')} Editar metas diárias</button></div>
 <div style="display:grid;gap:16px">`;
 MEALS.forEach((n,m)=>{const a=d[m]||[],t=tot(a);h+=`<article class="card p5 rise" style="animation-delay:${m*60}ms"><header class="row between mb2" style="align-items:baseline"><h3 class=h2>${n}</h3><p class="num sm-t"><span style="color:var(--chalk)">${Math.round(t.k)} kcal</span> · P ${r1(t.p)} · H ${r1(t.c)} · G ${r1(t.f)}</p></header>`+a.map((x,i)=>`<div class=li><span>${esc(x.n)} <span class=sm-t>· ${r1(x.g)} g</span></span><span class=row style="gap:12px"><span class="num sm-t">${Math.round(x.kcal)} kcal · ${r1(x.p)}P</span><button class=btn-x aria-label="Remover alimento" onclick="delFood(${m},${i})">${ic('trash-2')}</button></span></div>`).join('');
  h+=(ai&&ai.m===m?aiPanel():'')+(addM===m?`<div class="sub mt3"><div class="row between mb2"><p class=label>Adicionar alimento</p><button class=btn-x aria-label=Fechar onclick="addM=null;render()">${ic('x')}</button></div><div class=row><input id=fn${m} class="input grow" placeholder="Alimento"><input id=fg${m} class="input num sm" style="width:84px" inputmode=decimal placeholder="gramas"></div><p class="sm-t mt2">Valores por 100 g:</p><div class=row><input id=fk${m} class="input num sm" style="width:76px" placeholder=kcal><input id=fp${m} class="input num sm" style="width:68px" placeholder="P (g)"><input id=fc${m} class="input num sm" style="width:68px" placeholder="H (g)"><input id=ff${m} class="input num sm" style="width:68px" placeholder="G (g)"><button class=btn-volt onclick="addFood(${m})">${ic('plus')} Adicionar</button></div><div class=mt3><label class=photo><span id=pb${m}>${ic('camera')} Foto do prato ou produtos</span><input type=file accept="image/*" hidden onchange="photoFood(${m},this)"></label></div></div>`:`<div class="row mt2"><button class="btn-x sm-t" style="font-size:12px" onclick="addM=${m};render()">+ Adicionar alimento</button><label class=photo style="padding:6px 10px;font-size:12px"><span>${ic('camera')} Foto</span><input type=file accept="image/*" hidden onchange="photoFood(${m},this)"></label></div>`);
  h+=`</article>`});
 return h+`</div></section>`}

/* ---------- Suplementação (com horários) ---------- */
const addS=()=>{const n=$('#sn').value.trim();if(!n)return;const st=$('#ss').value.trim(),tm=$('#stm').value;if(tm&&'Notification' in window&&Notification.permission==='default')askNotif();mut(()=>D.supps.push({n,d:$('#sd').value,sl:$('#sl').value,tm,st:st===''?null:num(st)}))};
const togSd=(d,i)=>mut(()=>{const a=D.slog[d]||(D.slog[d]=[]),s=D.supps[i],k=a.indexOf(s.n);k<0?a.push(s.n):a.splice(k,1);if(s.st!=null)s.st=Math.max(0,s.st+(k<0?-1:1))});
const togS=i=>togSd(date,i);
const setSTm=(i,v)=>{if(v&&'Notification' in window&&Notification.permission==='default')askNotif();mut(()=>{D.supps[i].tm=v})};
function tSup(){const days=lastDays(7,date),WD=['D','S','T','Q','Q','S','S'],S=D.supps,done=S.filter(s=>(D.slog[date]||[]).includes(s.n)).length,ls=lowStock();

async function comp(f,max=1280,q=.82){let src,w,h;
 try{src=await createImageBitmap(f,{imageOrientation:'from-image'});w=src.width;h=src.height}
 catch(e){src=await new Promise((res,rej)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>rej(new Error('Não consegui ler esta imagem (formato não suportado). Tenta outra foto.'));i.src=u});w=src.naturalWidth;h=src.naturalHeight}
 const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}

/* ---------- Notificações: local + Web Push em segundo plano ---------- */
const pushOn=()=>LS('z5push')==='1';
const b64u=s=>{const b=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function subPush(){if(OFF||!('serviceWorker' in navigator)||!('PushManager' in window)||!notifOK())return false;
 const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();
 if(!s){const k=await fn('push',{action:'key'});s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)})}
 await fn('push',{action:'subscribe',sub:s.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone});LS('z5push','1');return true}
async function unsubPush(){try{LS('z5push',null);const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const s=reg&&await reg.pushManager.getSubscription();if(s){await Promise.race([fn('push',{action:'unsubscribe',endpoint:s.endpoint}),new Promise(r=>setTimeout(r,2500))]);await s.unsubscribe()}}catch(e){}}

 return`<div class="card p5 rise"><div class=label>${ic('bell')} Lembretes</div>`+(!sup?'<p class="sm-t mt2">Este browser não suporta notificações.</p>':ok?`<p class=mt2 style="font-size:14px">Notificações ativas neste dispositivo.</p><p class="sm-t mt1">${pushOn()?'Push em segundo plano: <span class=volt>ativo</span>. Os lembretes chegam mesmo com a app fechada.':'Push em segundo plano: inativo. Só recebes lembretes com a app aberta.'}</p><div class="row mt3"><button class=btn-ghost onclick="ping('Zone5Training','Notificação de teste','z5-test')">Testar</button>${pushOn()?'':`<button class=btn-volt onclick="askNotif()">Ativar push</button>`}</div>`:`<p class="sm-t mt2">Ativa as notificações para receberes lembretes à hora certa.</p><button class="btn-volt mt3" onclick="askNotif()">${ic('bell')} Ativar notificações</button>`)+`<p class="xs-t mt3">No iPhone, o push só funciona com a app instalada no ecrã principal (Partilhar → Adicionar ao ecrã principal).</p></div>`};
function due(t,hm){const out=[],hit=m=>hm>=m&&hm-m<=5,sl=(a,b,e)=>{a=mins(a);b=mins(b);if(a==null||b==null||!(e>=1))return[];const o=[];for(let m=a;m<=b;m+=e*60)o.push(m);return o},wr=WR();
 if(wr.on&&!waterDone(t))sl(wr.from,wr.to,wr.ev).forEach(m=>{if(hit(m))out.push({k:`w|${t}|${m}`,title:'Hora de beber água 💧',body:`Já bebeste ${wTot(t)} de ${wGoal()} ml hoje.`,tag:`z5-w-${t}-${m}`})});
 D.habits.forEach(h=>{const r=(D.hrem||{})[h];if(!r||(D.hlog[t]||[]).includes(h))return;sl(r.from||'07:00',r.to||'21:00',r.ev).forEach(m=>{if(hit(m))out.push({k:`h|${t}|${h}|${m}`,title:'Hábito pendente',body:h,tag:`z5-h-${t}-${h}-${m}`})})});
 D.supps.forEach(s=>{const m=mins(s.tm);if(m!=null&&hit(m)&&!(D.slog[t]||[]).includes(s.n))out.push({k:`s|${t}|${s.n}|${m}`,title:'Suplemento: '+s.n,body:`${s.d||'Hora da toma'} · ${s.tm}`,tag:`z5-s-${t}-${s.n}-${m}`})});return out}

function bioBase(d){const ks=Object.keys(D.bio||{}).filter(k=>k<d).sort().slice(-14),av=f=>{const v=ks.map(k=>num(D.bio[k][f])).filter(x=>x>0);return v.length>=3?avg(v):null};return{hrv:av('hrv'),rhr:av('rhr'),n:ks.length}}
function readiness(d){const b=bioAt(d);if(!b||!(num(b.hrv)>0||num(b.sleep)>0||num(b.rhr)>0))return null;const base=bioBase(d),P=[],why=[];
 if(num(b.hrv)>0){const r=base.hrv?b.hrv/base.hrv:1;P.push({k:'HRV',s:clamp(75+(r-1)*250),w:45});if(base.hrv)why.push({k:'hrv',bad:r<.9,txt:`A tua HRV de hoje (${Math.round(b.hrv)} ms) está ${Math.abs(Math.round((r-1)*100))}% ${r<1?'abaixo':'acima'} da tua média (${Math.round(base.hrv)} ms)`})}
 if(num(b.sleep)>0){P.push({k:'Sono',s:clamp(10+(b.sleep-4)*22.5),w:35});why.push({k:'sleep',bad:b.sleep<6.5,txt:`Dormiste ${fm(b.sleep)} h (o ideal são 7–9 h)`})}
 if(num(b.rhr)>0){const dl=base.rhr?b.rhr-base.rhr:0;P.push({k:'FC repouso',s:clamp(100-8*Math.max(0,dl)),w:20});if(base.rhr)why.push({k:'rhr',bad:dl>=4,txt:`A tua FC de repouso está ${Math.round(Math.abs(dl))} bpm ${dl>=0?'acima':'abaixo'} da tua média`})}
 let s=sum(P.map(p=>p.s*p.w))/sum(P.map(p=>p.w));const y=iso(new Date(new Date(d+'T12:00').getTime()-864e5));if(D.sessions.some(x=>x.d===y&&x.rpe>=9))s-=5;
 s=Math.round(clamp(s));return{score:s,level:s>=75?'Alta':s>=50?'Moderada':'Baixa',parts:P,why,cal:base.n<3}}
function reasonText(r,orig){const bad=r.why.filter(x=>x.bad).map(x=>x.txt);return(bad.length?bad.join('; ')+'.':`O teu Readiness Score de hoje é ${r.score}/100.`)+(r.why.some(x=>x.k==='hrv'&&x.bad)?' Isto indica uma recuperação autonómica incompleta (menor tónus parassimpático).':'')+` Alterámos o teu treino de ${orig} para Mobilidade e Recuperação Ativa para otimizar os teus ganhos sem induzir sobretreino. É uma estimativa orientativa, não aconselhamento médico.`}
function adjustFor(d){const r=readiness(d);D.adj=D.adj||{};D.adjOff=D.adjOff||{};if(!r)return;const c=D.adj[d],p=D.plans[wd(d)];
 if(r.score>=50){if(c&&c.auto)delete D.adj[d]}
 else if(c&&c.auto){c.score=r.score;c.reason=reasonText(r,c.orig)}
 else if(!c&&p&&!D.adjOff[d]&&isHard(p))D.adj[d]={name:'Mobilidade & Recuperação Ativa',exs:MOB.slice(),orig:p.name||'treino',score:r.score,reason:reasonText(r,p.name||'treino'),auto:true};
 if(date===d)startDraft()}
const keepOriginal=()=>{const t=iso();mut(()=>{D.adj=D.adj||{};delete D.adj[t];D.adjOff=D.adjOff||{};D.adjOff[t]=true;if(date===t)startDraft()}).then(ok=>ok&&toast('Treino original reposto'))};
function adjBanner(){const t=iso(),a=(D.adj||{})[t],r=readiness(t),p=D.plans[wd(t)];if(!r)return'';
 if(a)return`<div class="card p5 rise mb4" style="border-color:rgba(255,107,53,.45)"><div class=label style="color:var(--ember)">${ic('heart-pulse')} Treino ajustado pela prontidão (${r.score}/100)</div><p class="mt2" style="font-size:14px">${esc(a.reason)}</p><button class="btn-ghost mt3" onclick="keepOriginal()">Manter treino original (${esc(a.orig)})</button></div>`;
 if(r.score<50&&p&&!isHard(p))return`<div class="card p5 rise mb4" style="border-color:rgba(255,107,53,.45)"><div class=label style="color:var(--ember)">${ic('heart-pulse')} Prontidão baixa (${r.score}/100)</div><p class="mt2 sm-t">Considera reduzir o volume (menos séries) e manter 2–3 repetições em reserva hoje.</p></div>`;
 if(r.score>=75&&p&&isHard(p))return`<div class="card p5 rise mb4" style="border-color:rgba(212,255,58,.4)"><div class=label>${ic('heart-pulse')} Prontidão alta (${r.score}/100)</div><p class="mt2 sm-t">Bom dia para a sessão intensa prevista. Aquece bem e executa com qualidade.</p></div>`;
 return''}
const gauge=(v,col,label)=>{const C=2*Math.PI*52,off=C*(1-clamp(v)/100);return`<svg viewBox="0 0 120 120" style="width:132px;height:132px;flex-shrink:0" role=img aria-label="${label} ${Math.round(v)}"><circle cx=60 cy=60 r=52 fill=none stroke="#23251f" stroke-width=10 /><circle cx=60 cy=60 r=52 fill=none stroke="${col}" stroke-width=10 stroke-linecap=round stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 60 60)"/><text x=60 y=64 text-anchor=middle fill="#ecebe4" style="font:800 34px 'Big Shoulders Display',sans-serif">${Math.round(v)}</text><text x=60 y=82 text-anchor=middle fill="#9a9b8f" style="font:600 8px 'Instrument Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase">${label}</text></svg>`};
function bioModal(){const b=bioAt(iso())||{};dlg({title:'Dados biométricos de hoje',text:'Introduz os valores do teu relógio ou app (Apple Health, Google Fit, Garmin…). Podes preencher só alguns.',html:()=>`<div class="g nm" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">${[['hrv','HRV (ms)',b.hrv],['sleep','Sono (h)',b.sleep],['rhr','FC repouso (bpm)',b.rhr]].map(([f,l,v])=>`<label class=sm-t>${l}<input id=b_${f} class="input num mt1" inputmode=decimal value="${esc(mfv('b_'+f,v||''))}" oninput="mfset(this)"></label>`).join('')}</div>`,okLabel:'Guardar',
 onOk:async()=>{const g=f=>num(mfv('b_'+f,b[f]||'')),x={hrv:g('hrv'),sleep:g('sleep'),rhr:g('rhr')};if(!(x.hrv>0||x.sleep>0||x.rhr>0))throw new Error('Preenche pelo menos um valor.');if(x.hrv&&(x.hrv<5||x.hrv>300))throw new Error('HRV fora do intervalo (5–300 ms).');if(x.sleep&&x.sleep>16)throw new Error('Sono: máximo 16 h.');if(x.rhr&&(x.rhr<30||x.rhr>130))throw new Error('FC de repouso fora do intervalo (30–130 bpm).');
  const t=iso(),ok=await mut(()=>{D.bio=D.bio||{};D.bio[t]=Object.assign({},x,{src:'manual'});adjustFor(t)});if(!ok)throw new Error('Não foi possível guardar.')}})}
function mockBio(kind){const t=iso(),base=bioBase(t),h0=base.hrv||60,r0=base.rhr||56,rn=(a,b)=>a+Math.random()*(b-a);
 const x=kind==='low'?{hrv:Math.round(h0*rn(.55,.72)),sleep:r1(rn(4.6,5.7)),rhr:Math.round(r0+rn(4,8))}:{hrv:Math.round(h0*rn(.95,1.12)),sleep:r1(rn(7,8.4)),rhr:Math.round(r0+rn(-2,2))};
 mut(()=>{D.bio=D.bio||{};D.bio[t]=Object.assign(x,{src:'mock'});adjustFor(t)}).then(ok=>ok&&toast(kind==='low'?'Simulado: dia de prontidão baixa':'Dados simulados sincronizados'))}
function mockHistory(){const rn=(a,b)=>a+Math.random()*(b-a);mut(()=>{D.bio=D.bio||{};for(let i=14;i>=1;i--){const d=iso(new Date(Date.now()-i*864e5));if(!D.bio[d])D.bio[d]={hrv:Math.round(rn(54,68)),sleep:r1(rn(6.2,8.2)),rhr:Math.round(rn(53,58)),src:'mock'}}}).then(ok=>ok&&toast('14 dias de histórico simulado criados'))}
window.z5ImportBio=arr=>mut(()=>{D.bio=D.bio||{};(arr||[]).forEach(e=>{if(e&&/^\d{4}-\d{2}-\d{2}$/.test(e.date))D.bio[e.date]={hrv:num(e.hrv),sleep:num(e.sleep),rhr:num(e.rhr),src:String(e.src||'apple_health').slice(0,20)}});adjustFor(iso())}); // ponte para apps nativas (HealthKit / Health Connect)
function readySection(){const t=iso(),r=readiness(t),b=bioAt(t),vt=vitality(),col=!r?'#33362d':r.score>=75?CO.volt:r.score>=50?CO.tide:CO.ember;
 let a=`<div class="card rise" style="animation-delay:200ms"><div class="row between"><div class=label>${ic('heart-pulse')} Prontidão diária</div>${b&&b.src==='mock'?'<span class="ch ch-t">Dados simulados</span>':''}</div>`;
 a+=!r?`<p class="sm-t mt3">Sem dados biométricos hoje. Introduz HRV, sono e FC de repouso, ou sincroniza, para calcular o teu Readiness Score.</p>`:`<div class="row mt3" style="gap:20px;flex-wrap:nowrap;align-items:center">${gauge(r.score,col,'Readiness')}<div style="flex:1;min-width:0"><p class=h2 style="color:${col}">${r.level}</p>${r.parts.map(p=>`<div class=mt2><div class="row between sm-t"><span>${p.k}</span><span class=num>${Math.round(p.s)}</span></div>${bar(p.s,100,p.s>=75?'bg-v':p.s>=50?'bg-t':'bg-e')}</div>`).join('')}</div></div>${r.cal?'<p class="xs-t mt3">A calibrar: ainda sem pelo menos 3 dias de histórico para comparar com a tua média.</p>':''}`;
 a+=`<div class="row mt4"><button class=btn-ghost onclick="bioModal()">${ic('pencil')} Introduzir</button><button class=btn-ghost onclick="mockBio()">${ic('refresh-cw')} Sincronizar (simulado)</button></div><details class=mt3><summary>Ligar Apple Health / Google Fit</summary><p class="xs-t mt2">A ligação direta ao Apple Health e ao Google Health Connect exige uma app nativa de apoio (os browsers não acedem a estes dados). O modelo de dados já está pronto: <code>bio[data] = {hrv, sleep, rhr, src}</code> e a função <code>z5ImportBio([...])</code> recebe os dados dessa ponte. Para testar, usa os dados simulados:</p><div class="row mt2"><button class=btn-ghost onclick="mockHistory()">Gerar 14 dias de histórico</button><button class=btn-ghost onclick="mockBio('low')">Simular dia fraco</button></div></details></div>`;
 const ad=(D.adj||{})[t],p=D.plans[wd(t)];
 let c=`<div class="card rise" style="animation-delay:260ms"><div class=label>${ic('dumbbell')} Treino de hoje</div>`;
 if(ad)c+=`<p class="h2 mt2">${esc(ad.name)}</p><p class="sm-t">Em vez de: ${esc(ad.orig)}</p><p class="mt3" style="font-size:14px">${esc(ad.reason)}</p><button class="btn-ghost mt3" onclick="keepOriginal()">Manter treino original</button>`;
 else c+=`<p class="h2 mt2">${esc((p&&p.name)||'Sem plano definido')}</p>${r&&r.score>=75&&p&&isHard(p)?'<p class="sm-t mt2">Prontidão alta: bom dia para a sessão intensa.</p>':r&&r.score<50?'<p class="sm-t mt2">Prontidão baixa: reduz o volume e mantém reps em reserva.</p>':''}<a class="btn-ghost mt3" style="display:inline-flex" href="#/treino">Abrir treino ${ic('arrow-up-right')}</a>`;
 c+=`<div class=sub style="margin-top:16px"><p class=label>${ic('gauge')} Vitalidade</p>${vt.age&&vt.index!=null?`<p class="mt2"><span class="fd" style="font-size:30px;font-weight:800">${fm(vt.bioAge)}</span> <span class=sm-t>anos biológicos (cronológica ${vt.age})</span></p>`:`<p class="sm-t mt2">Define a tua idade para estimar a idade biológica.</p>`}<a class="sm-t" href="#/vitalidade">Ver índice de vitalidade →</a></div></div>`;
 return`<section class="g cc">${a}${c}</section>`}

/* ---------- Vitalidade & longevidade ---------- */
const isZ2=s=>Z2.test((s.plan||'')+' '+(s.ex||[]).map(e=>e.n).join(' ')),isZ5=s=>HARD.test((s.plan||'')+' '+(s.ex||[]).map(e=>e.n).join(' '));
function vWeeks(n){const w0=wk(iso()),out=[];for(let i=n-1;i>=0;i--){const k=iso(new Date(new Date(w0+'T12:00').getTime()-i*7*864e5)),ss=D.sessions.filter(s=>wk(s.d)===k);out.push({k,z2:sum(ss.filter(isZ2).map(s=>s.dur||0)),z5:ss.filter(isZ5).length,str:ss.filter(s=>(s.ex||[]).some(e=>e.s.length)||MOBR.test(s.plan||'')).length})}return out}
const wIdx=w=>(clamp(w.z2/150*100)*30+clamp(w.z5/1.5*100)*25+clamp(w.str/2*100)*25)/80;
function vitality(){const age=num((D.profile||{}).age),W4=vWeeks(4),a=f=>avg(W4.map(f)),z2=a(w=>w.z2),z5=a(w=>w.z5),st=a(w=>w.str);
 const rs=lastDays(7).map(readiness).filter(Boolean),sRec=rs.length?avg(rs.map(r=>r.score)):null;
 const rh=Object.keys(D.bio||{}).sort().slice(-14).map(k=>num(D.bio[k].rhr)).filter(x=>x>0),vo2=age&&rh.length?15.3*(208-0.7*age)/avg(rh):null;
 const parts=[{k:'Base aeróbica (Zona 2)',s:clamp(z2/150*100),w:30,v:`${Math.round(z2)} min/semana`,t:'Meta: ≥150 min/semana em Zona 2. Constrói a base aeróbica e melhora a função mitocondrial e a gestão de gordura.'},{k:'VO₂máx / Zona 5',s:clamp(z5/1.5*100),w:25,v:`${fm(z5)} sessões/semana`,t:'Meta: 1–2 sessões intensas por semana. O VO₂máx é um dos preditores mais fortes de longevidade.'},{k:'Força funcional & postura',s:clamp(st/2*100),w:25,v:`${fm(st)} sessões/semana`,t:'Meta: ≥2 sessões de força ou mobilidade por semana. Protege articulações, postura e independência funcional.'},{k:'Agilidade & recuperação cardiovascular',s:sRec,w:20,v:sRec==null?'sem dados biométricos':`prontidão média ${Math.round(sRec)}/100`,t:'Baseada na tua prontidão (HRV, sono, FC de repouso) nos últimos 7 dias. Reflete a capacidade de recuperar entre esforços.'}];
 const ok=parts.filter(p=>p.s!=null),index=ok.length?sum(ok.map(p=>p.s*p.w))/sum(ok.map(p=>p.w)):null;
 return{age,parts,index,vo2,z2,z5,st,bioAge:age&&index!=null?age+clamp((50-index)*0.1,-5,5):null}}
function ageModal(){dlg({title:'A tua idade',text:'Usada para estimar a idade biológica e o VO₂máx.',input:{type:'number',placeholder:'Idade em anos'},value:String((D.profile||{}).age||''),okLabel:'Guardar',onOk:async v=>{const n=num(v);if(!(n>=14&&n<=99))throw new Error('Indica uma idade entre 14 e 99.');const ok=await mut(()=>{D.profile=Object.assign({},D.profile||{},{age:Math.round(n)})});if(!ok)throw new Error('Não foi possível guardar.')}})}
function tVital(){const V=vitality(),W=vWeeks(vitW),lab=W.map(w=>w.k.slice(5)),d=V.bioAge!=null?V.bioAge-V.age:null;
 let h=hdr('Longevidade & capacidade funcional','Vitalidade',`<div class=row style="gap:4px">${[4,8,12].map(n=>`<button class="chip ${vitW===n?'on':''}" onclick="vitW=${n};render()">${n} sem.</button>`).join('')}</div>`);
 h+=`<section class="card mb6 rise"><div class="row between"><div><p class=label>Idade biológica estimada</p>${V.age&&V.index!=null?`<p class="fd" style="font-size:64px;font-weight:900;line-height:1;margin-top:8px"><span class="${d<=0?'volt':'ember'}">${fm(V.bioAge)}</span><span class=dust style="font-size:22px"> anos</span></p><p class=sm-t>Idade cronológica: <b style="color:var(--chalk)">${V.age} anos</b> · ${d<=0?`${fm(Math.abs(d))} anos mais jovem`:`${fm(d)} anos mais velho`} (estimativa)</p>`:`<p class="sm-t mt2">Define a tua idade e regista treinos para calcular.</p>`}</div><button class=btn-ghost onclick="ageModal()">${ic('pencil')} ${V.age?'Alterar idade':'Definir idade'}</button></div><p class="xs-t mt3">Índice motivacional baseado na regularidade dos treinos e na recuperação. Não é um diagnóstico nem substitui avaliação médica.</p></section>`;
 h+=`<section class="g g4">${stat('Índice de vitalidade',V.index==null?'—':Math.round(V.index),'/100','',V.index>=60?'volt':'')}${stat('VO₂máx estimado',V.vo2?fm(V.vo2):'—','ml/kg/min',V.vo2?'Pela FC de repouso e idade':'Precisa de FC de repouso e idade',0,60)}${stat('Zona 2',Math.round(V.z2),'min/sem','Média das últimas 4 semanas',0,120)}${stat('Zona 5',fm(V.z5),'sessões/sem','Média das últimas 4 semanas',0,180)}</section>`;
 h+=`<section class="card mb6 rise"><p class=label>Marcadores</p><h2 class="h2 mb4">O que mexe na tua longevidade</h2>${V.parts.map(p=>`<details style="margin-bottom:14px"><summary style="list-style:none"><div class="row between sm-t"><span style="color:var(--chalk);font-weight:600">${p.k}</span><span class=num>${p.s==null?'—':Math.round(p.s)+'/100'} · ${p.v}</span></div>${bar(p.s||0,100,p.s==null?'bg-c':p.s>=75?'bg-v':p.s>=50?'bg-t':'bg-e')}</summary><p class="xs-t mt2">${p.t}</p></details>`).join('')}</section>`;
 h+=`<section class="g g2"><div class="card rise"><p class=label>Zona 2 por semana</p><h2 class="h2 mb4">Base aeróbica</h2>${cv(240,{type:'bar',data:{labels:lab,datasets:[{type:'bar',label:'Minutos em Zona 2',data:W.map(w=>w.z2),backgroundColor:CO.tide,borderRadius:4},{type:'line',label:'Meta (150 min)',data:W.map(()=>150),borderColor:CO.volt,borderDash:[5,5],pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom'}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}})}</div>
 <div class="card rise"><p class=label>Regularidade (Z2 + Z5 + força)</p><h2 class="h2 mb4">Índice semanal</h2>${cv(240,{type:'line',data:{labels:lab,datasets:[{label:'Índice (0–100)',data:W.map(wIdx),borderColor:CO.volt,backgroundColor:'rgba(212,255,58,.08)',fill:true,tension:.35,pointRadius:4,pointBackgroundColor:CO.volt},{label:'Sessões Zona 5',data:W.map(w=>w.z5*25),borderColor:CO.ember,borderDash:[4,4],pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom'}},scales:{x:{grid:{display:false}},y:{min:0,max:100}}}})}<p class="xs-t mt2">A linha tracejada mostra as sessões de Zona 5 (25 pontos por sessão).</p></div></section>`;
 return h}

/* ---------- Treinador IA ---------- */
const COACH_Q=['Tenho apenas 25 minutos. Como adapto o treino de hoje?','Porque é que não estou a evoluir no supino?','Que carga devo experimentar na próxima sessão?','Faltei a dois treinos. Como reorganizo esta semana?'];
function fmtMsg(t){const L=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let o='',ul=false;for(const l of L){const m=/^\s*(?:[-*•]|\d+[.)])\s+(.*)/.exec(l);if(m){if(!ul){o+='<ul style="margin:6px 0 6px 18px;list-style:disc">';ul=true}o+='<li>'+m[1]+'</li>'}else{if(ul){o+='</ul>';ul=false}if(l.trim())o+='<p style="margin:6px 0">'+l+'</p>'}}return o+(ul?'</ul>':'')}
function tCoach(){const r=readiness(iso());
 let h=hdr('Treinador inteligente','Coach',chat.length?`<button class=btn-ghost onclick="chat=[];render()">${ic('trash-2')} Limpar</button>`:'');
 h+=`<section class="card rise"><p class="sm-t">Responde com base no teu plano, cargas, nutrição, hidratação${r?` e prontidão de hoje (${r.score}/100)`:''}. ${me.role==='admin'&&cur!==me.id?'<b>A usar os dados do cliente aberto.</b> ':''}Não substitui um profissional de saúde.</p><div class=mt4 style="display:grid;gap:10px">`;
 if(!chat.length)h+=`<div class=row style="gap:8px">${COACH_Q.map((q,i)=>`<button class=chip style="text-align:left;white-space:normal" onclick="sendCoach(COACH_Q[${i}])">${esc(q)}</button>`).join('')}</div>`;
 h+=chat.map(m=>`<div style="display:flex;justify-content:${m.role==='user'?'flex-end':'flex-start'}"><div class=bub style="${m.role==='user'?'background:var(--volt);color:var(--ink)':m.err?'border-color:var(--ember)':''}">${m.role==='user'?esc(m.content):fmtMsg(m.content)}</div></div>`).join('');
 if(coachBusy)h+=`<div class=row style="gap:10px"><span class=spin></span><span class=sm-t>O treinador está a analisar os teus dados…</span></div>`;
 h+=`<div id=chatend></div></div><div class="row mt4" style="flex-wrap:nowrap"><input id=cq class=input placeholder="Pergunta ao treinador…" onkeydown="event.key==='Enter'&&sendCoach()" ${coachBusy||OFF?'disabled':''}><button class=btn-volt aria-label=Enviar onclick="sendCoach()" ${coachBusy||OFF?'disabled':''}>${ic('send')}</button></div>${OFF?'<p class="xs-t mt2">Sem ligação: o treinador precisa de internet.</p>':''}</section>`;
 return h}
async function sendCoach(txt){const q=String(txt||(($('#cq')||{}).value)||'').trim();if(!q||coachBusy||OFF)return;chat.push({role:'user',content:q});coachBusy=true;render();coachScroll();
 try{const r=readiness(iso()),res=await fn('coach',{messages:chat.filter(m=>!m.err).slice(-8).map(m=>({role:m.role,content:m.content})),today:iso(),userId:me.role==='admin'&&cur!==me.id?cur:undefined,readiness:r?{score:r.score,level:r.level}:null});chat.push({role:'assistant',content:res.reply})}
 catch(e){chat.push({role:'assistant',content:'⚠️ '+(e.message||'Erro'),err:true})}
 coachBusy=false;render();coachScroll()}
const coachScroll=()=>setTimeout(()=>{const e=document.getElementById('chatend');if(e&&e.scrollIntoView)e.scrollIntoView({block:'end',behavior:'smooth'})},40);

boot();
</script></body></html>
